<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>OMA LabRoom Booking</title>
  <script>window.PORTAL = <?!= portalBootstrap ?>;</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.20.12/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: {
            sans: ['Kanit', 'sans-serif'], // เปลี่ยนจากเดิมที่มี Inter ให้เหลือแค่ Kanit
            mono: ['JetBrains Mono', 'monospace'],
            space: ['Space Grotesk', 'sans-serif'],
            thai: ['Sarabun', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { background-color:#f8fafc; font-family:'Kanit',sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width:6px; height:6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background:#f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }

    @keyframes droid-patrol { 0%{transform:translateX(40px)} 50%{transform:translateX(325px) scaleX(-1)} 100%{transform:translateX(40px)} }
    @keyframes floatEffect    { 0%,100%{transform:translateX(0px) rotate(-1deg)} 50%{transform:translateX(-4px) rotate(1deg)} }
    @keyframes engineerWalk   { 0%{transform:translateX(370px)} 50%{transform:translateX(115px)} 100%{transform:translateX(370px)} }
    @keyframes walkSlightBob  { 0%,100%{transform:rotate(-3deg) translateY(0px)} 50%{transform:rotate(3deg) translateY(-2px)} }
    @keyframes fadeInUp       { 0%{opacity:0;transform:translateX(8px)} 100%{opacity:1;transform:translateX(0)} }

    .animate-droid-patrol  { animation: droid-patrol 25s linear infinite alternate; }
    .animate-droid-bob     { animation-timing-function: ease-in-out; }
    .animate-engineer-walk { animation:engineerWalk 30s linear infinite; }
    .animate-engineer-bob  { animation:walkSlightBob 1.2s linear infinite alternate; }
    .animate-fade-in-up    { animation:fadeInUp 0.25s ease-out; }
    .image-rendering-pixelated { image-rendering:pixelated; image-rendering:crisp-edges; }
  </style>
</head>
<body class="text-slate-800 antialiased">

<div id="app-root">
  <div class="min-h-screen flex flex-col items-center justify-center bg-slate-950 text-white  gap-4">
    <div class="w-12 h-12 border-4 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm tracking-widest text-slate-400">กำลังโหลดข้อมูลระบบ LAB-01...</p>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ════════════════════════════════════════
// SPRITE COMPONENTS
// ════════════════════════════════════════
const DroidSprite = () => (
  <svg width="28" height="28" viewBox="0 0 14 14" className="image-rendering-pixelated drop-shadow-md">
    <rect x="3" y="3" width="8" height="7" fill="#334155"/>
    <rect x="4" y="4" width="6" height="5" fill="#475569"/>
    <rect x="4" y="5" width="6" height="2" fill="#059669" className="animate-pulse"/>
    <rect x="6" y="5" width="2" height="1" fill="#a7f3d0"/>
    <rect x="6" y="1" width="2" height="2" fill="#dc2626"/>
    <rect x="6.5" y="0" width="1" height="1" fill="#f59e0b" className="animate-pulse"/>
    <rect x="2" y="5" width="1" height="3" fill="#cbd5e1"/>
    <rect x="11" y="5" width="1" height="3" fill="#cbd5e1"/>
    <rect x="5" y="10" width="1" height="2" fill="#f97316"/>
    <rect x="8" y="10" width="1" height="2" fill="#f97316"/>
    <rect x="6" y="10" width="2" height="3" fill="#ef4444" className="animate-pulse"/>
  </svg>
);

const EngineerSprite = () => (
  <svg width="28" height="32" viewBox="0 0 14 16" className="image-rendering-pixelated drop-shadow-sm">
    <rect x="4" y="1" width="6" height="3" fill="#78350f"/>
    <rect x="5" y="0" width="4" height="1" fill="#451a03"/>
    <rect x="4" y="4" width="6" height="3" fill="#fef08a"/>
    <rect x="4" y="4" width="5" height="1.5" fill="#06b6d4" className="animate-pulse"/>
    <rect x="3" y="7" width="8" height="6" fill="#f8fafc"/>
    <rect x="5" y="7" width="4" height="6" fill="#e2e8f0"/>
    <rect x="6" y="8" width="2" height="1.5" fill="#e11d48"/>
    <rect x="2" y="8" width="1" height="4" fill="#cbd5e1"/>
    <rect x="11" y="8" width="1" height="4" fill="#cbd5e1"/>
    <rect x="4" y="13" width="6" height="2" fill="#1e3a8a"/>
    <rect x="3" y="15" width="3.5" height="1" fill="#0f172a"/>
    <rect x="7.5" y="15" width="3.5" height="1" fill="#0f172a"/>
  </svg>
);

// ════════════════════════════════════════
// ICON COMPONENTS
// ════════════════════════════════════════
const I = (d) => ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:d}}/>;

const CalendarIcon      = I('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>');
const RefreshCwIcon     = I('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>');
const SearchIcon        = I('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>');
const ShieldIcon        = I('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>');
const AlertTriangleIcon = I('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>');
const SparklesIcon      = I('<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707-.707M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/>');
const CompassIcon       = I('<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>');
const PencilIcon        = I('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>');
const PlusIcon          = I('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>');
const XIcon             = I('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>');
const Trash2Icon        = I('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>');

// ════════════════════════════════════════
// CONFIGURATION
// ════════════════════════════════════════
const DESKS = [
  { id:'L1', name:'L1', side:'left'  },
  { id:'L2', name:'L2', side:'left'  },
  { id:'L3', name:'L3', side:'left'  },
  { id:'R1', name:'R1', side:'right' },
  { id:'R2', name:'R2', side:'right' },
  { id:'R3', name:'R3', side:'right' },
  { id:'R4', name:'R4', side:'right' },
];

const ALL_BOOKABLE_IDS = [...DESKS.map(d => d.id), 'Rack'];
const ROOM_LAYOUT = {

  Rack : { left:'2%', top:'5%', width:'9%', height:'15%' },

  R1 : { left:'13%', top:'5%', width:'18%', height:'25%' },
  R2 : { left:'32%', top:'5%', width:'18%', height:'25%' },
  R3 : { left:'51%', top:'5%', width:'18%', height:'25%' },
  R4 : { left:'70%', top:'5%', width:'18%', height:'25%' },

  CAB3 : { left:'90%', top:'5%', width:'9%', height:'25%' },

  CAB2 : { left:'90%', top:'35%', width:'9%', height:'25%' },

  L1 : { left:'2%', top:'65%', width:'18%', height:'25%' },
  L2 : { left:'21%', top:'65%', width:'18%', height:'25%' },
  L3 : { left:'40%', top:'65%', width:'18%', height:'25%' },

  E : { left:'70%', top:'75%', width:'15%', height:'15%' },

  CAB1 : { left:'90%', top:'65%', width:'9%', height:'25%' }
};

// ════════════════════════════════════════
// DATE / TIME FORMAT HELPERS  [REQ-1]
// ════════════════════════════════════════
/** yyyy-MM-dd  →  dd/mm/yyyy */
const formatDateDisplay = (s) => {
  if (!s) return '';
  const p = String(s).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(s);
};

/** ISO / Date string  →  dd/mm/yyyy hh:mm */
const formatDateTimeDisplay = (s) => {
  if (!s) return '';
  try {
    const d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} `
         + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  } catch(e) { return String(s); }
};

// ════════════════════════════════════════
// APP COMPONENT
// ════════════════════════════════════════
function App() {

  // ── Core data ──
  const [bookings,     setBookings]     = useState([]);
  const [users,        setUsers]        = useState([]);
  const [staticAreas,  setStaticAreas]  = useState([]);

  // ── Auth ──
  const [currentUser,    setCurrentUser]    = useState(null);
  const [isLoggedIn,     setIsLoggedIn]     = useState(false);
  const [loginEmail,     setLoginEmail]     = useState('');
  const [loginPassword,  setLoginPassword]  = useState('');
  const [loginError,     setLoginError]     = useState('');

  // ── Date / time selection ──
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [selectedHour, setSelectedHour] = useState(() => {
  const now = new Date();
  return now.getHours() + now.getMinutes() / 60;
});

  // ── UI ──
  const [loading,       setLoading]       = useState(true);
  const [errorMessage,  setErrorMessage]  = useState(null);
  const [toastMessage,  setToastMessage]  = useState(null);
  const [searchQuery,   setSearchQuery]   = useState('');

  // ── Booking modal ──
  const [isModalOpen,   setIsModalOpen]   = useState(false);
  const [targetDeskId,  setTargetDeskId]  = useState(null);
  const [targetBooking, setTargetBooking] = useState(null);

  // ── Booking form fields ──
  const addHoursToTime = (time, hours = 1) => {const [h, m] = time.split(':').map(Number);
  const date = new Date();date.setHours(h, m, 0, 0);date.setHours(date.getHours() + hours);
   return date.toTimeString().slice(0, 5);};
  const getCurrentTime = () => {return new Date().toTimeString().slice(0, 5);};

  const [bookingProject,   setBookingProject]   = useState('');
  const [customProject, setCustomProject] = useState('');
  const [bookingStartTime, setBookingStartTime] = useState(() => {return getCurrentTime();});
  const [bookingEndTime, setBookingEndTime] = useState(() => {return addHoursToTime(getCurrentTime(), 1);});
  const [bookingEndDate,   setBookingEndDate]   = useState('');
        useEffect(() => {
          setBookingEndTime(addHoursToTime(bookingStartTime, 1));
        }, [bookingStartTime]);
  const [bookingDevices, setBookingDevices] = useState([{ equipment: '', matCode: '' }]);
  const [bookingObjective, setBookingObjective] = useState(''); // 👈 เพิ่มเพิ่มบรรทัดนี้เข้าไป
  const [bookingNotes,     setBookingNotes]     = useState('');
  const [modalError,       setModalError]       = useState(null);
  const [submitting,       setSubmitting]       = useState(false);

  // ── Static area (Rack/CAB) ──
  const [selectedStaticAreaId, setSelectedStaticAreaId] = useState(null);
  const handleStaticAreaClick = (id) => {setSelectedStaticAreaId(prev =>prev === id ? null : id);};

  // ── Admin edit modal [REQ-4] ──
  const [isEditingArea, setIsEditingArea] = useState(false);
  const [editAreaForm,  setEditAreaForm]  = useState(null);
  const [newItemInput,  setNewItemInput]  = useState('');
  const [savingArea,    setSavingArea]    = useState(false);

  // ── Derived: selected area object (live from state so admin edits auto-refresh) ──
  const selectedStaticArea = useMemo(
    () => staticAreas.find(a => a.id === selectedStaticAreaId) || null,
    [staticAreas, selectedStaticAreaId]
  );

  // ── Time helpers ──
  const timeToDec = (t) => {
    if (!t) return 0;
    const [h,m] = String(t).split(':').map(Number);
    return h + (m||0)/60;
  };
  const decToTimeStr = (d) => {
    const h = Math.floor(d), m = Math.round((d-h)*60);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  };
  const currentTimeStr = useMemo(() => decToTimeStr(selectedHour), [selectedHour]);

  // ── [REQ-3] Check if booking is active at current selectedDate + selectedHour ──
  const isBookingActiveNow = useCallback((b) => {
    const endDate = b.endDate || b.date;
    if (endDate !== b.date) {
      // Multi-day booking
      if (selectedDate > b.date && selectedDate < endDate) return true; // intermediate day = all day
      if (selectedDate === b.date)    return selectedHour >= timeToDec(b.startTime);
      if (selectedDate === endDate)   return selectedHour <  timeToDec(b.endTime);
      return false;
    }
    return selectedHour >= timeToDec(b.startTime) && selectedHour < timeToDec(b.endTime);
  }, [selectedDate, selectedHour]);

  // ── Bookings visible for selected date (multi-day aware) ──
  const activeBookingsForTimeline = useMemo(() => bookings.filter(b => {
    // ✅ เพิ่มการกรอง: ถ้าถูกยกเลิก หรือใช้งานเสร็จแล้ว ไม่ต้องนำมาคำนวณบนผัง
    if (b.Status === 'CANCELLED' || b.Status === 'FINISHED') return false;

    const end = b.endDate || b.date;
    return selectedDate >= b.date && selectedDate <= end;
  }), [bookings, selectedDate]);

  // ── Desk Display State (รองรับ 3 สถานะ) ──
  const getDeskDisplayState = (deskId) => {
    const bookingsForDesk = activeBookingsForTimeline.filter(b => b.deskId === deskId);
    if (bookingsForDesk.length === 0) return { state: 'free', booking: null };

    const activeBooking = bookingsForDesk.find(b => isBookingActiveNow(b));
    if (activeBooking) return { state: 'active', booking: activeBooking }; // สีแดง (กำลังใช้)

    // ถ้าไม่ active ตอนนี้ แสดงว่ามีคิวจองไว้ช่วงเวลาอื่นของวันนี้
    return { state: 'reserved', booking: bookingsForDesk[0] }; // สีส้ม (จองแล้ว)
  };

  // ── [REQ-2] Active DUTs — show ONLY currently-in-use equipment ──
  const activeDUTs = useMemo(
    () => activeBookingsForTimeline.filter(b => b.equipment && isBookingActiveNow(b)),
    [activeBookingsForTimeline, isBookingActiveNow]
  );

  // ── Stats ──
  const stats = useMemo(() => {
    const occupiedIds = [], activeUnits = [];
    const teamsSet = new Set();
    activeBookingsForTimeline.forEach(b => {
      if (isBookingActiveNow(b)) {
        occupiedIds.push(b.deskId);
        activeUnits.push({ deskId:b.deskId, systemName:b.systemName, equipment:b.equipment||'N/A', teamName:b.teamName });
      }
      if (b.teamName) teamsSet.add(b.teamName.split(' (')[0]);
    });
    // รวม Rack ใน free/utilization (ALL_BOOKABLE_IDS = desks + Rack)
    const freeDesks    = ALL_BOOKABLE_IDS.filter(id => !occupiedIds.includes(id));
    const utilization  = Math.round((occupiedIds.length / ALL_BOOKABLE_IDS.length) * 100);
    return { freeDesks, activeUnits, teamsCount:teamsSet.size, teamsList:[...teamsSet], utilization, todayTotal:activeBookingsForTimeline.length };
  }, [activeBookingsForTimeline, isBookingActiveNow]);

  // ── Initial load — ล็อกอินทำที่ OMA Portal แล้ว หน้านี้แค่โหลดข้อมูลด้วย
  //    token ที่ portal ส่งมาให้ (window.PORTAL) ไม่มี session ของตัวเองอีกต่อไป ──
  useEffect(() => {
    loadData();
  }, []);

  const loadData = () => {
    setLoading(true); setErrorMessage(null);
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res?.status === 'success') {
            setBookings(res.bookings || []);
            setUsers(res.users || []);
            if (res.staticAreas?.length > 0) setStaticAreas(res.staticAreas);
            // ประกอบ currentUser จากตัวตนที่ Hub ยืนยันแล้ว (window.PORTAL) +
            // ข้อมูลทีม/ตำแหน่ง/allowedProjects จากทำเนียบ Users (ไม่มี password
            // ติดมาอีกต่อไป — ดู getDatabaseData ฝั่ง Code.gs)
            const me = (res.users || []).find(u =>
              u.email && window.PORTAL && u.email.toLowerCase() === (window.PORTAL.email || '').toLowerCase());
            setCurrentUser({
              email: (window.PORTAL && window.PORTAL.email) || '',
              name: (me && me.name) || (window.PORTAL && window.PORTAL.name) || '',
              team: me ? me.team : '',
              position: me ? me.position : '',
              allowedProjects: me ? me.allowedProjects : [],
              role: (window.PORTAL && window.PORTAL.isAdmin) ? 'super_admin' : (me ? me.role : 'user')
            });
            setIsLoggedIn(true);
          } else { setErrorMessage("โหลดข้อมูลไม่สำเร็จ: " + (res?.message||'')); }
          setLoading(false);
        })
        .withFailureHandler(err => { setErrorMessage("เชื่อมต่อไม่ได้: " + err); setLoading(false); })
        .getDatabaseData(window.PORTAL && window.PORTAL.token);
    } else {
      setErrorMessage("กรุณาเปิดใช้งานผ่าน Google Apps Script Environment");
      setLoading(false);
    }
  };

  const triggerToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 4000);
  };

  // ── Open booking modal ──
  const handleDeskClick = (deskId) => {
    const { booking: bk } = getDeskDisplayState(deskId);
    setTargetDeskId(deskId); setTargetBooking(bk); setModalError(null);
    if (!bk) {
      setBookingStartTime(getCurrentTime());
      setBookingEndDate(selectedDate);
      setBookingObjective('');
      setBookingDevices([{ equipment: '', matCode: '' }]); 
      setBookingObjective('');
      setBookingNotes('');

      if (currentUser?.allowedProjects?.length > 0) setBookingProject(currentUser.allowedProjects[0]);
    }
    setIsModalOpen(true);
  };

//ปุ่ม "เพิ่ม/ลบ" อุปกรณ์
  const addDeviceRow = () => {
  setBookingDevices([...bookingDevices, { equipment: '', matCode: '' }]);
};

const removeDeviceRow = (index) => {
  setBookingDevices(bookingDevices.filter((_, i) => i !== index));
};

const updateDeviceField = (index, field, value) => {
  const updated = [...bookingDevices];
  updated[index][field] = value;
  setBookingDevices(updated);
};

  // ── [REQ-2] [REQ-3] Submit new booking ──
  const handleSaveBooking = (e) => {
    e.preventDefault(); setModalError(null);
    if (!currentUser)                  return setModalError("กรุณาเข้าสู่ระบบก่อนจองคิว");
    if (!bookingProject) return setModalError("กรุณาเลือกโครงการที่ต้องการทดสอบ");
    if (bookingProject === 'OTHER' && !customProject.trim()) return setModalError("กรุณาระบุชื่อโครงการที่ต้องการ");
    if (!bookingObjective.trim()) return setModalError("กรุณาระบุวัตถุประสงค์การใช้งาน");

  // ดึงค่าโปรเจกต์ที่จะใช้จริง
  const finalProjectName = bookingProject === 'OTHER' ? customProject.trim() : bookingProject;

  const validDevices = bookingDevices.filter(d => d.equipment.trim() !== '');
    if (validDevices.length === 0) return setModalError("กรุณาระบุชื่ออุปกรณ์อย่างน้อย 1 รายการ");
    if (validDevices.some(d => !d.matCode.trim())) return setModalError("กรุณาระบุ Mat.Code ให้ครบทุกอุปกรณ์");

    const endDateVal = bookingEndDate || selectedDate;
    if (endDateVal < selectedDate)     return setModalError("วันสิ้นสุดต้องไม่น้อยกว่าวันเริ่มต้น");
    if (endDateVal === selectedDate && timeToDec(bookingStartTime) >= timeToDec(bookingEndTime))
                                       return setModalError("เวลาสิ้นสุดต้องอยู่หลังเวลาเริ่มต้น (กรณีจองวันเดียวกัน)");

    const payload = {
      id: `bk-${Date.now()}`,
      deskId: targetDeskId,
      systemName: finalProjectName,
      teamName: currentUser.name,
      team: currentUser.team, // ✅ เพิ่ม: ใช้หาอีเมลหัวหน้างาน (ห้ามใช้ teamName เพราะเป็นชื่อผู้จอง)
      userEmail: currentUser.email,
      date: selectedDate,
      startTime: bookingStartTime,
      endTime: bookingEndTime,
      objective: bookingObjective,
      endDate: endDateVal,
      notes: bookingNotes,
      equipment: validDevices.map(d => d.equipment.trim()).join(', '), 
      matCode: validDevices.map(d => d.matCode.trim()).join(', '),
    };

    setSubmitting(true);
    if (typeof google !== 'undefined' && google.script?.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res?.status === 'success') { triggerToast(res.message); setIsModalOpen(false); loadData(); }
          else setModalError(res?.message || "ไม่สามารถจองได้ เนื่องจากเวลาซ้อนทับกับคิวอื่น");
          setSubmitting(false);
        })
        .withFailureHandler(err => { setModalError("เกิดข้อผิดพลาด: " + err); setSubmitting(false); })
        .saveNewBooking(window.PORTAL && window.PORTAL.token, payload);
    }
  };

  // ── Delete booking ──
  const handleDeleteBooking = (id, ownerEmail) => {
    if (!currentUser) return alert("กรุณาเข้าสู่ระบบก่อนทำรายการ");
    const isSA = currentUser.role === 'super_admin';
    if (currentUser.email !== ownerEmail && !isSA) return alert("คุณไม่มีสิทธิ์ยกเลิกคิวของผู้อื่น");
    if (!confirm(isSA ? "[Admin] ยืนยันยกเลิกคิวนี้?" : "ยืนยันยกเลิกคิวนี้?")) return;
    setSubmitting(true);
    if (typeof google !== 'undefined' && google.script?.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res?.status === 'success') { triggerToast(res.message); setIsModalOpen(false); loadData(); }
          else alert("ไม่สามารถทำรายการ: " + res?.message);
          setSubmitting(false);
        })
        .withFailureHandler(err => { alert("เกิดข้อผิดพลาด: " + err); setSubmitting(false); })
        .deleteBookingById(window.PORTAL && window.PORTAL.token, id);
    }
  };

  // ── Extend Booking Modal (ต่อเวลาแบบอิสระ) ──
  const [isExtendModalOpen, setIsExtendModalOpen] = useState(false);
  const [extendTargetBooking, setExtendTargetBooking] = useState(null);
  const [extendEndDate, setExtendEndDate] = useState('');
  const [extendEndTime, setExtendEndTime] = useState('');
  const [extendReason, setExtendReason] = useState('');
  const [extendError, setExtendError] = useState(null);
  const [extendSubmitting, setExtendSubmitting] = useState(false);

  const openExtendModal = (bk) => {
    setExtendTargetBooking(bk);
    // ตั้งค่าเริ่มต้นให้เป็นวัน-เวลาสิ้นสุดเดิมของคิวนั้น
    setExtendEndDate(bk.endDate || bk.date);
    setExtendEndTime(bk.endTime);
    setExtendReason('');
    setExtendError(null);
    setIsExtendModalOpen(true);
  };

  const handleExtendSubmit = (e) => {
    e.preventDefault();
    if (!extendEndDate || !extendEndTime || !extendReason.trim()) {
      setExtendError("กรุณาระบุวันที่และเวลาที่ต้องการต่ออายุ");
      return;
    }
    setExtendSubmitting(true);
    setExtendError(null);

    if (typeof google !== 'undefined' && google.script?.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res?.status === 'success') {
            triggerToast(res.message);
            setIsExtendModalOpen(false);
            loadData(); // โหลดข้อมูลใหม่เพื่อรีเฟรชหน้าเว็บ
          } else {
            setExtendError(res?.message);
          }
          setExtendSubmitting(false);
        })
        .withFailureHandler(err => {
          setExtendError("เกิดข้อผิดพลาด: " + err);
          setExtendSubmitting(false);
        })
        .extendBookingCustom(window.PORTAL && window.PORTAL.token, extendTargetBooking.id, extendEndDate, extendEndTime, extendReason);
    }else {
      // สำหรับทดสอบใน Dev mode
      setTimeout(() => {
        triggerToast("จำลองการต่อเวลาสำเร็จ (Dev Mode)");
        setIsExtendModalOpen(false);
        setExtendSubmitting(false);
      }, 1000);
    }
  };

  // ── [REQ-4] Admin edit area ──
  const openEditArea = (area) => {
    setEditAreaForm({ ...area, items: [...(area.items||[])] });
    setNewItemInput(''); setIsEditingArea(true);
  };
  const addAreaItem = () => {
    if (!newItemInput.trim()) return;
    setEditAreaForm(p => ({ ...p, items: [...p.items, newItemInput.trim()] }));
    setNewItemInput('');
  };
  const removeAreaItem = (idx) =>
    setEditAreaForm(p => ({ ...p, items: p.items.filter((_,i) => i !== idx) }));

  const saveAreaEdit = () => {
    setSavingArea(true);
    if (typeof google !== 'undefined' && google.script?.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res?.status === 'success') {
            setStaticAreas(prev => prev.map(a => a.id === editAreaForm.id ? { ...editAreaForm } : a));
            setIsEditingArea(false);
            triggerToast(res.message);
          } else alert("บันทึกไม่สำเร็จ: " + res?.message);
          setSavingArea(false);
        })
        .withFailureHandler(err => { alert("เกิดข้อผิดพลาด: " + err); setSavingArea(false); })
        .saveStaticAreaData(window.PORTAL && window.PORTAL.token, editAreaForm);
    } else {
      // Dev mode
      setStaticAreas(prev => prev.map(a => a.id === editAreaForm.id ? { ...editAreaForm } : a));
      setIsEditingArea(false); setSavingArea(false);
      triggerToast("บันทึกเรียบร้อย (Dev Mode)");
    }
  };

  // ── Search filter (แสดงประวัติทั้งหมด) ──
  const historyBookings = useMemo(() => {
    const q = searchQuery.toLowerCase().trim();
    
    // ดึงจาก bookings ทั้งหมด และแปลงข้อมูล f ทุกตัวให้เป็น String ก่อนค้นหา
    const filtered = bookings.filter(b => !q || [
      b.systemName, b.teamName, b.deskId, b.userEmail, b.equipment, b.matCode, b.Objective
    ].some(f => String(f || '').toLowerCase().includes(q)));
    
    // เรียงลำดับจากวันที่ล่าสุด (ใหม่สุด) ลงไปเก่าสุด
    return filtered.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
  }, [bookings, searchQuery]);

  // ── Multi-day time range label ──
  const timeRangeLabel = (b) => {
    const ed = b.endDate || b.date;
    return ed !== b.date
      ? `${formatDateDisplay(b.date)} ${b.startTime} → ${formatDateDisplay(ed)} ${b.endTime}`
      : `${b.startTime} – ${b.endTime}`;
  };

  // ════════════════════════════════════════
  // LOADING — เข้าสู่ระบบทำที่หน้า OMA Portal แล้ว หน้านี้แค่รอโหลดข้อมูลด้วย
  // token ที่ portal ส่งมาให้เท่านั้น ไม่มีหน้า login ของตัวเองอีกต่อไป
  // ════════════════════════════════════════
  if (!isLoggedIn || !currentUser) {
    return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
          {errorMessage ? (
            <div className="bg-rose-950/50 border border-rose-900/50 rounded-xl p-4 text-rose-400 text-xs font-semibold flex items-center gap-1.5 max-w-md">
              <AlertTriangleIcon className="w-4 h-4 shrink-0"/><span>{errorMessage}</span>
            </div>
          ) : (
            <p className="text-xs text-slate-400 animate-pulse">กำลังโหลดข้อมูล...</p>
          )}
        </div>
    );
  }

  // ════════════════════════════════════════
  // MAIN SCREEN
  // ════════════════════════════════════════
  return (
    <div className="min-h-screen bg-[#f8fafc] flex flex-col">

      {/* Toast */}
      {toastMessage && (
        <div className="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-slate-800 text-emerald-400 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 z-50 text-xs  animate-bounce">
          <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"/>
          <span>{toastMessage}</span>
        </div>
      )}

      {/* Header */}
      <header className="bg-slate-950 text-white relative border-b border-emerald-950/50 shadow-lg">
        <div className="absolute inset-0 bg-[linear-gradient(to_right,#022c2225_1px,transparent_1px),linear-gradient(to_bottom,#022c2225_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none"/>
        <div className="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 relative z-10">
          <div className="flex items-center gap-3">
            <div className="p-2.5 bg-emerald-950/80 border border-emerald-500/30 rounded-xl relative">
              <CompassIcon className="w-6 h-6 text-emerald-400"/>
              <span className="absolute top-0 right-0 w-2 h-2 bg-rose-500 rounded-full animate-ping"/>
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-lg  font-extrabold tracking-tight text-white uppercase sm:text-xl">OMA | LAB-01</h1>
                <span className="text-[9px] text-emerald-400 font-bold bg-emerald-950/80 border border-emerald-500/25 px-1.5 py-0.5 rounded">ONLINE V1.0</span>
              </div>
              <p className="text-[11px] text-slate-400 font-sans tracking-wide">ระบบจองโต๊ะและอุปกรณ์ทดสอบ เพื่อใช้ในห้องทดสอบระบบ</p>
            </div>
          </div>
          <div className="flex items-center gap-3 shrink-0">
            <div className="text-right hidden md:block">
              <span className="text-[10px] text-slate-500 block uppercase ">บัญชีผู้ใช้งาน</span>
              <span className="text-xs font-bold text-slate-200">{currentUser?.name}</span>
              <span className="text-[9.5px] font-medium text-emerald-400 block ">[{currentUser?.position || currentUser?.role}]</span>
            </div>
            {/* ออกจากระบบทำที่หน้า OMA Portal หลัก ไม่ใช่ในหน้านี้อีกต่อไป */}
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-6 py-8 flex-1 space-y-8 w-full">

        {errorMessage && (
          <div className="bg-rose-50 border border-rose-100 rounded-2xl p-4 text-xs font-semibold text-rose-700 flex items-center gap-2 shadow-sm">
            <AlertTriangleIcon className="w-5 h-5 shrink-0"/><span>{errorMessage}</span>
          </div>
        )}

        {/* ── Date / Time Controls ── */}
        <section className="bg-white rounded-2xl border border-slate-200/60 p-5 shadow-sm flex flex-col md:flex-row items-center justify-between gap-5 text-slate-700">
          <div className="flex items-center gap-2.5 w-full md:w-auto">
            <div className="p-2 bg-emerald-50 text-emerald-800 rounded-lg"><CalendarIcon className="w-4 h-4"/></div>
            <div className="flex-1 md:flex-none">
              <label className="text-[9.5px] uppercase text-slate-400 block font-bold">1. เลือกวันที่ใช้งาน</label>
              <input type="date" value={selectedDate}
                onChange={e => { setSelectedDate(e.target.value); triggerToast(`เปลี่ยนวันที่เป็น: ${formatDateDisplay(e.target.value)}`); }}
                className="text-xs font-bold text-slate-800 focus:outline-none cursor-pointer mt-0.5"/>
              {/* [REQ-1] แสดง format dd/mm/yyyy */}
              <span className="text-[9px] text-emerald-600 block mt-0.5">{formatDateDisplay(selectedDate)}</span>
            </div>
          </div>
          <div className="flex-1 w-full space-y-1">
            <div className="flex justify-between items-center text-[10px] text-slate-400">
              <span className="font-extrabold uppercase">2. เลือกช่วงเวลา</span>
              <span className="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 font-extrabold text-xs">
                เวลาที่เลือก: {currentTimeStr} น.
              </span>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-[10px] text-slate-400 shrink-0">00:00น.</span>
              <input type="range" min="0" max="23.5" step="0.5" value={selectedHour}
                onChange={e => setSelectedHour(parseFloat(e.target.value))}
                className="flex-1 accent-emerald-600 h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer"/>
              <span className="text-[10px] text-slate-400 shrink-0">23:30น.</span>
            </div>
          </div>
          <button onClick={loadData} disabled={loading}
            className="w-full md:w-auto px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 cursor-pointer shadow-md disabled:opacity-50">
            <RefreshCwIcon className={`w-3.5 h-3.5 ${loading?'animate-spin':''}`}/>
            <span>REFRESH SHEET</span>
          </button>
        </section>

        {/* ── Dashboard Cards ── */}
        <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">

          {/* Card 1: Free desks */}
          <div className="bg-white rounded-2xl border border-emerald-100/80 p-4 shadow-sm flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-wide">1. โต๊ะว่างขณะนี้</span>
                <span className="text-[9px] text-emerald-500 font-bold bg-emerald-50 px-1.5 rounded">AVAILABLE</span>
              </div>
              <h4 className="text-xl  font-extrabold text-slate-800">{stats.freeDesks.length} / {ALL_BOOKABLE_IDS.length} โต๊ะ</h4>
            </div>
            <div className="mt-2 flex flex-wrap gap-1">
              {stats.freeDesks.length > 0
                ? stats.freeDesks.map(id => <span key={id} className="text-[9px]  font-bold bg-emerald-50 text-emerald-700 px-1 py-0.5 rounded border border-emerald-100/50">{id}</span>)
                : <span className="text-[10px] text-rose-600 italic">เต็มแล้ว</span>}
            </div>
          </div>

          {/* Card 2: Active DUTs */}
          <div className="bg-white rounded-2xl border border-rose-100/80 p-4 shadow-sm flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold  text-rose-600 uppercase tracking-wide">2. อุปกรณ์ใช้งานอยู่</span>
                <span className="text-[9px]  text-rose-500 font-bold bg-rose-50 px-1 rounded animate-pulse">RUNNING</span>
              </div>
              <h4 className="text-xl  font-extrabold text-slate-800">{stats.activeUnits.length} เครื่อง</h4>
            </div>
            <div className="mt-2 text-[8px]  text-slate-500 space-y-1 max-h-[48px] overflow-y-auto pr-1">
              {stats.activeUnits.length > 0
                ? stats.activeUnits.map((u,i) => (
                    <div key={i} className="flex justify-between border-b border-rose-50 pb-0.5 truncate gap-1">
                      <span className="font-bold text-rose-700 shrink-0">[{u.deskId}]</span>
                      <span className="truncate">{u.equipment}</span>
                    </div>
                  ))
                : <span className="text-[9.5px] text-slate-400 italic block py-2 text-center">ไม่มีอุปกรณ์ที่ใช้งานอยู่</span>}
            </div>
          </div>

          {/* Card 3: Teams */}
          <div className="bg-white rounded-2xl border border-indigo-100/80 p-4 shadow-sm flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold  text-indigo-600 uppercase tracking-wide">3. ทีมเข้าแล็บวันนี้</span>
                <span className="text-[9px]  text-indigo-500">{stats.teamsCount} ทีม</span>
              </div>
              <h4 className="text-xl  font-extrabold text-slate-800">{stats.teamsCount} ทีม</h4>
            </div>
            <div className="mt-2 flex flex-wrap gap-1 max-h-[48px] overflow-y-auto">
              {stats.teamsList.length > 0
                ? stats.teamsList.map(t => <span key={t} className="text-[9px] font-sans font-bold bg-indigo-50 text-indigo-800 px-1.5 py-0.5 rounded border border-indigo-100/50 max-w-full truncate block">• {t}</span>)
                : <span className="text-[10px] text-slate-400 italic block py-2 w-full text-center">ไม่มีคิววันนี้</span>}
            </div>
          </div>

          {/* Card 4: Utilization */}
          <div className="bg-white rounded-2xl border border-sky-100/80 p-4 shadow-sm flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold  text-sky-600 uppercase tracking-wide">4. อัตราใช้งาน</span>
                <span className="text-[9px]  text-sky-500 font-bold bg-sky-50 px-1 rounded">LOAD</span>
              </div>
              <h4 className="text-xl  font-extrabold text-slate-800">{stats.utilization}%</h4>
            </div>
            <div className="mt-3">
              <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div className={`h-full rounded-full transition-all duration-500 ${stats.utilization<30?'bg-emerald-500':stats.utilization<75?'bg-amber-500':'bg-rose-500'}`} style={{ width:`${stats.utilization}%` }}/>
              </div>
              <div className="flex justify-between text-[8px]  mt-1 text-slate-400"><span>0%</span><span>100%</span></div>
            </div>
          </div>

          {/* Card 5: Today bookings */}
          <div className="bg-white rounded-2xl border border-violet-100/80 p-4 shadow-sm flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between mb-1">
                <span className="text-[10px] font-bold  text-violet-600 uppercase tracking-wide">5. รายการจอง</span>
                <span className="text-[9px]  text-violet-500 font-semibold">{formatDateDisplay(selectedDate)}</span>
              </div>
              <h4 className="text-xl  font-extrabold text-slate-800">{stats.todayTotal} รายการ</h4>
            </div>
            <div className="mt-2 text-[8px]  text-slate-500 space-y-1 max-h-[60px] overflow-y-auto pr-1">
              {activeBookingsForTimeline.slice(0,5).map(b => (
                <div key={b.id} className="flex justify-between items-center border-b border-slate-50 pb-0.5 truncate gap-1">
                  <span className="font-bold text-violet-700 shrink-0">[{b.deskId}]</span>
                  <span className="truncate text-slate-600">{b.startTime}-{b.endTime}{(b.endDate && b.endDate!==b.date)?' ✚':''}</span>
                </div>
              ))}
              {activeBookingsForTimeline.length === 0 && <span className="text-[9px] text-slate-400 italic block py-2 text-center">ไม่มีคิว</span>}
            </div>
          </div>

        </section>

        {/* ── Map + Right Panel ── */}
        <section className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

          {/* ──────────── LEFT: Floor Map (7/12) ──────────── */}
          <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200/60 p-6 shadow-sm flex flex-col items-center">
            <div className="w-full pb-3 border-b border-slate-100 mb-6 flex justify-between items-center flex-wrap gap-2 text-xs">
              <div>
                <h3 className=" font-bold text-slate-800 text-sm flex items-center gap-1.5">
                  <CompassIcon className="w-4 h-4 text-emerald-600"/>
                  <span>ผังห้อง LAB-01</span>
                </h3>
                <p className="text-[11px] text-slate-400">{formatDateDisplay(selectedDate)} เวลา {currentTimeStr} น. • คลิกโต๊ะเพื่อจอง</p>
              </div>
              <div className="flex items-center gap-3  text-[10px]">
                <div className="flex items-center gap-1"><span className="w-3 h-3 rounded border border-emerald-300 bg-emerald-50 inline-block"/><span>ว่าง</span></div>
                <div className="flex items-center gap-1"><span className="w-3 h-3 rounded border border-rose-300 bg-rose-50 inline-block"/><span>กำลังทดสอบ</span></div>
              </div>
            </div>

            <div className="relative flex items-center justify-center w-full overflow-auto">
              <div className="relative border-4 border-slate-700/85 bg-slate-50/80 rounded-2xl shadow-inner select-none overflow-visible"
                style={{ width:'100%', maxWidth:'1400px', aspectRatio:'16/9',
                  backgroundImage:'linear-gradient(to right,rgba(220,225,235,1) 1px,transparent 1px),linear-gradient(to bottom,rgba(220,225,235,1) 1px,transparent 1px)',
                  backgroundSize:'16px 16px' }}>


                <div className="absolute left-0 top-[175px] w-[7px] h-[90px] bg-red-600/90 border-b border-x border-red-700 z-20 flex items-center justify-center shadow">
                  <span className="text-[6.5px] text-white  font-bold leading-none tracking-tighter whitespace-nowrap rotate-[-90deg]">Window</span>
                </div>
                <div  className=" absolute flex items-center justify-center border-y border-dashed border-slate-300" style={{left:'0', right:'18%', top:'35%', height:'25%'}}>  <span className="text-slate-400 text-xs  tracking-[0.3em] uppercase"> Main walkway </span></div>
                  <div className="opacity-20  text-[7px] text-slate-500 tracking-widest font-extrabold whitespace-nowrap [writing-mode:vertical-lr] uppercase">พื้นที่ส่วนกลาง
                </div>

                    <div className="absolute -bottom-4 bg-indigo-900/80 text-indigo-300  text-[6px] px-1 py-0.5 rounded leading-none whitespace-nowrap font-bold border border-indigo-500/20">γ_ENGINEER</div>

                          </div>

                    const { state: deskState, booking: bk } = getDeskDisplayState(desk.id);
                    const sel = targetDeskId === desk.id;
                    const ed  = bk?.endDate || bk?.date;
                    const mdLabel = (bk && ed !== bk.date) ? `UNTIL ${formatDateDisplay(ed)}` : (bk ? (deskState === 'active' ? `BUSY to ${bk.endTime}` : `RESV ${bk.startTime}-${bk.endTime}`) : '');
                    
                    const sty = ROOM_LAYOUT[desk.id];
                    
                    return (
                      <button key={desk.id} style={sty} onClick={() => handleDeskClick(desk.id)}

                          ${deskState === 'active' ? 'bg-rose-50/95 hover:bg-rose-100/90 border-rose-400 text-rose-900 border-dashed'

                          : sel ? 'bg-emerald-50 border-emerald-500 ring-4 ring-emerald-100/70 text-emerald-950 z-10'
                          : 'bg-white hover:bg-slate-50 border-emerald-100 text-neutral-800 hover:border-emerald-400'}`}>
                        <div className="flex items-center justify-between w-full">
                          <span className="text-xs  font-bold"><span className="text-[10px] text-slate-400 font-normal">#</span>{desk.name}</span>
                          <div className={`w-2.5 h-2.5 rounded-sm ring-2 
                            ${deskState === 'active' ? 'bg-rose-500 ring-rose-100 animate-pulse' 
                            : deskState === 'reserved' ? 'bg-amber-400 ring-amber-100'

                          {deskState !== 'free' ? (
                            <div className="text-[9px] leading-tight font-sans">

                              <p className={`truncate font-semibold text-[8px] ${deskState === 'active' ? 'text-rose-700' : 'text-amber-700'}`}>{bk.teamName.split(' (')[0]}</p>
                              <span className={`text-[8px] font-bold uppercase py-0.5 px-1 rounded-sm block truncate mt-0.5 
                                ${deskState === 'active' ? 'bg-rose-200/60 text-rose-800' : 'bg-amber-200/60 text-amber-800'}`}>
                                {mdLabel}
                              </span>
                            </div>
                          ) : (
                            <div className="text-[10px]">
                              <p className="text-emerald-700 font-bold flex items-center gap-0.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-0.5 animate-pulse inline-block"/> ว่าง ON</p>
                              <p className="text-[9px] text-slate-400  tracking-tighter uppercase font-semibold">RESERVE</p>
                            </div>

                {/* Entrance E */}
                <button
                style={{  ...ROOM_LAYOUT.E,  position:'absolute'}}

                  <svg width="55" height="55" viewBox="0 0 60 60">
                    <polygon points="30,5 55,55 5,55" fill="#dc2626" stroke="#b91c1c" strokeWidth="2.5"/>
                    <text x="30" y="42" textAnchor="middle" fill="#ffffff" fontSize="21" fontFamily="sans-serif" fontWeight="900">E</text>
                  </svg>

                </button>

                {/* Rack — BOOKABLE (จองได้เหมือน desk) */}
                  {(() => {
                    const { state: rackState, booking: rackBk } = getDeskDisplayState('Rack');
                    const rackSel = targetDeskId === 'Rack';
                    const rackED  = rackBk?.endDate || rackBk?.date;
                    const rackLbl = rackBk ? (rackED !== rackBk?.date ? `UNTIL ${formatDateDisplay(rackED)}` : (rackState === 'active' ? `BUSY to ${rackBk.endTime}` : `RESV ${rackBk.startTime}-${rackBk.endTime}`)) : '';
                    
                    return (
                      <button
                        onClick={() => handleDeskClick('Rack')}
