                          : 'bg-white/70 hover:bg-white/90 border-slate-300 text-slate-600 hover:border-slate-400 hover:scale-105'}`}
                      >
                        <div className="flex items-center justify-between w-full">
                          <span className={`text-[10px]  font-bold ${rackState === 'active' ? 'text-[#D62828]' : rackState === 'reserved' ? 'text-amber-700' : 'text-slate-700'}`}>RACK</span>
                          <div className={`w-2.5 h-2.5 rounded-full shadow-sm
                            ${rackState === 'active' ? 'bg-[#D62828] animate-pulse shadow-[0_0_6px_#D62828]' 
                            : rackState === 'reserved' ? 'bg-amber-500' 
                            : 'bg-emerald-500 shadow-[0_0_5px_#10b981]'}`}/>
                        </div>
                        <div className="text-[8px]  leading-tight mt-1">
                          {rackState !== 'free' ? (
                            <>
                              <p className={`font-bold truncate text-[9px] ${rackState === 'active' ? 'text-[#D62828]' : 'text-amber-700'}`}>{rackBk.teamName.split(' (')[0]}</p>
                              <span className={`text-[7px] font-bold px-1.5 py-0.5 rounded block truncate mt-1 
                                ${rackState === 'active' ? 'bg-[#D62828]/20 text-[#D62828]' : 'bg-amber-500/20 text-amber-800'}`}>
                                {rackLbl}
                              </span>
                            </>
                          ) : (
                            <>
                              <p className="text-emerald-600 font-bold text-[9px] flex items-center gap-1">
                                <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full inline-block"></span> ว่าง
                              </p>
                            </>
                          )}
                        </div>
                      </button>
                    );
                  })()}

                {/* CAB3 */}
                <button onClick={() => handleStaticAreaClick('CAB3')} onMouseEnter={() => setSelectedStaticAreaId('CAB3')}
                style={{  ...ROOM_LAYOUT.CAB3,  position:'absolute'}}
                  className={`absolute w-[80px] h-[55px] rounded-lg transition-all duration-300 text-left p-2 border-2 flex flex-col justify-between shadow-sm cursor-pointer select-none z-20 ${selectedStaticAreaId==='CAB3'?'bg-amber-50 border-amber-500 ring-4 ring-amber-100/50':'bg-slate-200 hover:bg-slate-100 border-slate-300 text-slate-800'}`}>
                  <div className="flex items-center justify-between w-full">
                    <span className="text-[10px]  font-bold text-slate-700">CAB3</span>
                    <span className="w-1.5 h-1.5 rounded-sm bg-slate-500"/>
                  </div>
                  <span className="text-[7.5px] text-slate-500  font-extrabold text-center block uppercase w-full">DOC</span>
                </button>

                {/* CAB2 */}
                <button onClick={() => handleStaticAreaClick('CAB2')} onMouseEnter={() => setSelectedStaticAreaId('CAB2')}
                style={{  ...ROOM_LAYOUT.CAB2,  position:'absolute'}}
                  className={`absolute w-[80px] h-[55px] rounded-lg transition-all duration-300 text-left p-2 border-2 flex flex-col justify-between shadow-sm cursor-pointer select-none z-20 ${selectedStaticAreaId==='CAB2'?'bg-amber-50 border-amber-500 ring-4 ring-amber-100/50':'bg-slate-200 hover:bg-slate-100 border-slate-300 text-slate-800'}`}>
                  <div className="flex items-center justify-between w-full">
                    <span className="text-[10px]  font-bold text-slate-700">CAB2</span>
                    <span className="w-1.5 h-1.5 rounded-sm bg-slate-500"/>
                  </div>
                  <span className="text-[7.5px] text-slate-500  font-extrabold text-center block uppercase w-full">RAILWAY</span>
                </button>

                {/* CAB1 */}
                <button onClick={() => handleStaticAreaClick('CAB1')} onMouseEnter={() => setSelectedStaticAreaId('CAB1')}
                style={{  ...ROOM_LAYOUT.CAB1,  position:'absolute'}}
                  className={`absolute w-[80px] h-[55px] rounded-lg transition-all duration-300 text-left p-2 border-2 flex flex-col justify-between shadow-sm cursor-pointer select-none z-20 ${selectedStaticAreaId==='CAB1'?'bg-amber-50 border-amber-500 ring-4 ring-amber-100/50':'bg-slate-200 hover:bg-slate-100 border-slate-300 text-slate-800'}`}>
                  <div className="flex items-center justify-between w-full">
                    <span className="text-[10px]  font-bold text-slate-700">CAB1</span>
                    <span className="w-1.5 h-1.5 rounded-sm bg-slate-500"/>
                  </div>
                  <span className="text-[7.5px] text-slate-500  font-extrabold text-center block uppercase w-full">PAPER</span>
                </button>

              </div>
            </div>

            {/* Static Area HUD */}
            <div className="mt-4 w-full border-t border-slate-100 pt-4">
              <div className={`p-4 rounded-xl border transition-all duration-300 ${selectedStaticArea?'bg-amber-500/5 border-amber-200 shadow-xs':'bg-slate-50/50 border-slate-100 text-slate-400'}`}>
                {selectedStaticArea ? (
                  <div className="space-y-2 text-left animate-fade-in-up">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                      <div className="flex items-center gap-1.5">
                        <span className={`inline-block w-2.5 h-2.5 rounded-sm ${selectedStaticArea.id==='E'?'bg-red-500 animate-pulse':selectedStaticArea.id==='Rack'?'bg-indigo-600 animate-pulse':'bg-amber-500'}`}/>
                        <span className=" font-black text-xs uppercase tracking-wide text-neutral-800">{selectedStaticArea.name}</span>
                      </div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-[9px]  bg-amber-500/10 text-amber-700 border border-amber-500/25 px-1.5 py-0.5 rounded font-extrabold uppercase">ตู้อุปกรณ์</span>
                        {/* [REQ-4] Admin edit button */}
                        {currentUser?.role === 'super_admin' && (
                          <button onClick={() => openEditArea(selectedStaticArea)}
                            className="flex items-center gap-1 text-[9px]  bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-0.5 rounded font-bold transition-all cursor-pointer">
                            <PencilIcon className="w-3 h-3"/> Admin แก้ไข
                          </button>
                        )}
                      </div>
                    </div>
                    <p className="text-[10.5px] font-sans text-neutral-500 leading-normal">{selectedStaticArea.info}</p>
                    <div className="pt-2 border-t border-slate-200/50">
                      <span className="text-[8.5px] font-sans font-bold text-neutral-400 block">🛠️ ผู้รับผิดชอบ:</span>
                      <span className="text-[11px] font-sans font-bold text-neutral-700 block bg-white px-2 py-0.5 rounded border border-slate-150 mt-0.5 inline-block">{selectedStaticArea.responsibleTeam}</span>
                    </div>
                    <div className="pt-2 space-y-1">
                      <span className="text-[8.5px] font-sans font-bold text-neutral-400 block">📦 อุปกรณ์ ({(selectedStaticArea.items||[]).length} รายการ):</span>
                      <div className="grid grid-cols-1 gap-1 max-h-[100px] overflow-y-auto custom-scrollbar">
                        {(selectedStaticArea.items||[]).map((it,idx) => (
                          <div key={idx} className="flex items-start gap-1 py-0.5 px-2 rounded bg-white/70 border border-slate-150 text-[10px] text-neutral-600">
                            <span className="text-amber-500 mr-1 font-bold shrink-0">•</span><span>{it}</span>
                          </div>
                        ))}
                        {(selectedStaticArea.items||[]).length === 0 && <p className="text-[10px] text-slate-400 italic text-center py-2">ไม่มีรายการอุปกรณ์</p>}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="py-4 text-center space-y-1.5 select-none font-sans">
                    <p className="text-[9px] uppercase  tracking-widest text-slate-500 font-extrabold">ข้อมูลอุปกรณ์</p>
                    <p className="text-[11px] text-slate-400 w-full leading-relaxed">คลิกที่ 
                    <strong className="text-amber-500">RACK</strong> เพื่อจองหรือดูรายละเอียดอุปกณ์
                    คลิกที่ <strong className="text-amber-500">CAB1 CAB2 CAB3</strong> เพื่อดูรายละเอียดอุปกรณ์</p>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* ──────────── RIGHT: Panels (5/12) ──────────── */}
          <div className="lg:col-span-5 flex flex-col gap-6">

            {/* [REQ-3] Objective Panel — shows ONLY active (in-use) bookings */}
              <div className="relative bg-slate-950/80 backdrop-blur-xl text-white rounded-2xl border border-slate-800 p-5 shadow-2xl overflow-hidden space-y-3.5">
                {/* แสงสะท้อนบางๆ ด้านหลังสไตล์ Liquid Glass */}
                <div className="absolute -top-12 -right-12 w-32 h-32 bg-[#D62828]/10 rounded-full blur-3xl pointer-events-none"></div>

                <div className="relative flex items-center justify-between border-b border-slate-800 pb-2 z-10">
                  <h3 className=" font-bold text-xs uppercase tracking-wider text-slate-200 flex items-center gap-1.5">
                    <span className="inline-block w-2.5 h-2.5 rounded-sm bg-[#D62828] shadow-[0_0_8px_#D62828] animate-pulse"/>
                    <span>วัตถุประสงค์การใช้งาน</span>
                  </h3>
                  <span className="text-[9px]  bg-slate-900/80 text-slate-400 border border-slate-700 px-2 py-0.5 rounded uppercase">
                    {formatDateDisplay(selectedDate)} {currentTimeStr}
                  </span>
                </div>

                <div className="relative space-y-2 max-h-[180px] overflow-y-auto custom-scrollbar pr-1 z-10">
                  {activeDUTs.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-6">ไม่มีรายการใช้งานขณะนี้</p>
                  ) : activeDUTs.map(b => (
                    <div key={b.id} className="p-3 rounded-xl bg-white/5 hover:bg-white/10 backdrop-blur-md border border-slate-700/50 transition-all flex flex-col gap-2.5 text-xs">
                      
                      {/* ส่วนหัว: ผู้จองและโต๊ะ */}
                      <div className="flex items-center justify-between pb-1.5 border-b border-slate-700/50">
                        <span className="text-[9.5px] text-slate-300 truncate">
                          <strong>{b.teamName.split(' (')[0]}</strong> @ Desk <span className="bg-[#D62828]/20 px-1 py-0.5 rounded  font-bold text-[#D62828] text-[9px]">{b.deskId}</span>
                          <span className="text-slate-400 ml-1.5  text-[9px]">{b.systemName}</span>
                        </span>
                        <span className="text-[8px] tracking-wide font-extrabold bg-[#D62828]/20 text-[#D62828] border border-[#D62828]/30 px-1.5 py-0.5 rounded uppercase animate-pulse shrink-0">
                          IN USE
                        </span>
                      </div>

                      {/* ส่วนเนื้อหา: วัตถุประสงค์ */}
                      <div className="text-[10.5px] text-slate-200 whitespace-pre-wrap leading-relaxed">
                        {b.Objective || <span className="text-slate-500 italic">ไม่ระบุวัตถุประสงค์...</span>}
                      </div>
                      
                    </div>
                  ))}
                </div>
              </div>

            {/* Search */}
            <div className="bg-white rounded-2xl border border-slate-200/60 p-5 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                <SearchIcon className="w-4 h-4 text-slate-500"/>
                <span>ค้นหาประวัติการจอง</span>
              </h3>
              <input type="text" placeholder="ชื่อโครงการ, โต๊ะ, ผู้จอง, อุปกรณ์..." value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full text-sm border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/15"/>
            </div>
            
            {/* [REQ-5] Booking list — แสดงประวัติทั้งหมด */}
            <div className="bg-white rounded-2xl border border-slate-200/60 p-5 shadow-sm space-y-4 flex-1 flex flex-col">
              <h3 className="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b border-slate-100 pb-2 shrink-0">
                <SparklesIcon className="w-4 h-4 text-emerald-600 animate-pulse"/>
                <span>ประวัติการจองทั้งหมด</span>
                <span className="ml-auto text-[9px] font-mono text-slate-400 font-normal">{historyBookings.length} รายการ</span>
              </h3>

              {loading ? (
                <div className="text-center py-12 space-y-2">
                  <div className="w-6 h-6 border-2 border-emerald-600 border-t-transparent rounded-full animate-spin mx-auto"/>
                  <p className="text-xs text-slate-400 font-mono">กำลังโหลดข้อมูล...</p>
                </div>
              ) : historyBookings.length === 0 ? (
                <div className="text-center py-12 text-slate-400">
                  <p className="text-xs italic">ไม่มีประวัติการจองในระบบ</p>
                </div>
              ) : (
                <div className="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1" style={{ maxHeight:'480px' }}>
                  {historyBookings.map(bk => {
                    // --- เริ่มโค้ดส่วนที่แก้ไข ---
                    const isCancelled = bk.Status === 'CANCELLED';
                    const isFinished = bk.Status === 'FINISHED';
                    
                    const endD = bk.endDate || bk.date || ""; 
                    const timeStr = bk.endTime ? String(bk.endTime) : "00:00";
                    
                    // 1. แยกชั่วโมง-นาที
                    const timeParts = timeStr.match(/(\d{1,2}):(\d{1,2})/);
                    const hour = timeParts ? parseInt(timeParts[1], 10) : 0;
                    const min = timeParts ? parseInt(timeParts[2], 10) : 0;
                    
                    // 2. แยกปี-เดือน-วัน (รองรับทั้ง YYYY-MM-DD และ DD/MM/YYYY)
                    const dateParts = endD.split(/[-/]/);
                    let year = 0, month = 0, day = 0;
                    if (dateParts.length === 3) {
                      if (dateParts[0].length === 4) { 
                        year = parseInt(dateParts[0], 10);
                        month = parseInt(dateParts[1], 10) - 1; // JS นับเดือนจาก 0
                        day = parseInt(dateParts[2], 10);
                      } else { 
                        day = parseInt(dateParts[0], 10);
                        month = parseInt(dateParts[1], 10) - 1;
                        year = parseInt(dateParts[2], 10);
                      }
                    }
                    
                    // 3. คำนวณเวลาและสถานะ
                    const endMs = new Date(year, month, day, hour, min, 0).getTime();
                    const isExpired = endMs > 0 && endMs < Date.now();
                    const isInactive = isCancelled || isFinished || isExpired;

                    // ── รูปแบบที่ 1: รายการแบบย่อ (Compact List) สำหรับคิวที่ Inactive ──
                    if (isInactive) {
                      return (
                        <div key={bk.id} className="py-3 px-2 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                          <div className="flex items-center justify-between gap-3 text-[10px]">
                            <div className="flex items-center gap-2 overflow-hidden">
                              <span className={`font-mono px-1.5 py-0.5 rounded font-bold shrink-0 ${isCancelled ? 'bg-rose-50 text-rose-600' : 'bg-slate-100 text-slate-500'}`}>
                                {bk.deskId === 'Rack' ? 'RACK' : `${bk.deskId}`}
                              </span>
                              <div className="truncate">
                                <span className="font-bold text-slate-600">{bk.systemName}</span>
                                <span className="text-slate-400 ml-1 truncate">({bk.teamName})</span>
                              </div>
                            </div>
                            <div className="text-right shrink-0 flex items-center gap-2">
                              <span className="text-slate-400 font-mono text-[9px]">
                                {formatDateDisplay(bk.date)}
                              </span>
                              <span className={`font-bold uppercase text-[8px] tracking-wide w-12 text-right ${isCancelled ? 'text-rose-400' : 'text-slate-400'}`}>
                                {isCancelled ? 'ยกเลิก' : isExpired ? 'หมดเวลา' : 'เสร็จสิ้น'}
                              </span>
                            </div>
                          </div>
                          {/* 📌 เพิ่มวัตถุประสงค์ในรายการ Inactive */}
                          {(bk.Objective || bk.notes) && (
                            <div className="mt-1.5 pl-9 text-[9px] text-slate-500 italic truncate">
                              {bk.Objective || bk.notes}
                            </div>
                          )}
                        </div>
                      );
                    }

                    // ── รูปแบบที่ 2: กล่องเต็ม (Full Card) สำหรับคิว Active สไตล์เดิม ──
                    return (
                      <div key={bk.id} className="p-3.5 bg-white border border-emerald-200 shadow-sm rounded-xl flex items-start justify-between gap-3 text-xs transition-all relative overflow-hidden">
                        <div className="absolute left-0 top-0 bottom-0 w-1 bg-emerald-500"></div>
                        
                        <div className="space-y-1.5 flex-1 overflow-hidden pl-1">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="font-mono text-[9px] px-1.5 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">
                              {bk.deskId === 'Rack' ? 'RACK' : `DESK ${bk.deskId}`}
                            </span>
                            <span className="font-bold text-slate-800 text-[11px] leading-tight">{bk.systemName}</span>
                          </div>
                          <div className="text-[10px] text-slate-500 space-y-0.5">
                            <div className="truncate">จองโดย: <strong className="text-slate-600">{bk.teamName}</strong></div>
                            <div className="text-[9px] font-mono font-normal text-slate-400 truncate">({bk.userEmail})</div>
                          </div>
                          {bk.Objective && (
                            <p className="text-[10px] text-slate-600 bg-slate-50 p-1.5 rounded border border-slate-100 mt-1 whitespace-pre-wrap">
                              <span className="font-bold text-emerald-700 mr-1">วัตถุประสงค์:</span>{bk.Objective}
                            </p>
                          )}
                          {bk.notes && (
                            <p className="text-[10px] text-amber-700 bg-amber-50 p-1.5 rounded border border-amber-100/60 mt-1 whitespace-pre-wrap">
                              <span className="font-bold text-amber-800 mr-1">หมายเหตุ:</span>{bk.notes}
                            </p>
                          )}
                          {bk.equipment && (
                            <p className="text-[9px] text-indigo-700 font-mono bg-indigo-50 border border-indigo-100/60 px-1.5 py-0.5 rounded w-fit mt-1">
                              {bk.equipment}{bk.matCode ? ` [${bk.matCode}]` : ''}
                            </p>
                          )}
                        </div>
                        <div className="text-right space-y-1.5 font-mono text-[9px] shrink-0">
                          <span className="font-extrabold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 text-[9px] inline-block leading-tight text-right">
                            {formatDateDisplay(bk.date)} {bk.startTime}
                          </span>
                          
                          <div className="flex flex-col gap-1 mt-2">
                            <button onClick={() => openExtendModal(bk)}
                              className="block w-full text-right text-emerald-600 hover:text-emerald-700 hover:underline cursor-pointer font-bold uppercase tracking-wide text-[8px]">
                              [ ต่อเวลา ]
                            </button>
                            <button onClick={() => handleDeleteBooking(bk.id, bk.userEmail)}
                              className="block w-full text-right text-rose-600 hover:text-rose-700 hover:underline cursor-pointer font-bold uppercase tracking-wide text-[8px]">
                              [ ยกเลิกคิว ]
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

          </div>
        </section>

      </main>

      {/* ════════════════════ BOOKING MODAL ════════════════════ */}
      {isModalOpen && (
        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-md w-full overflow-hidden flex flex-col animate-fade-in-up">

            <div className="px-6 py-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
              <div>
                <h4 className=" font-bold text-slate-800 text-sm flex items-center gap-1.5">
                  <span className="w-2.5 h-2.5 bg-emerald-500 rounded-sm"/>
                  {/* [REQ-1] format วันที่ */}
                  <span>โต๊ะ #{targetDeskId} — {formatDateDisplay(selectedDate)}</span>
                </h4>
                <p className="text-[10px] text-slate-400 mt-0.5">
                  {targetBooking ? 'ดูรายละเอียดการจอง' : 'สร้างการจองใหม่'}
                </p>
              </div>
              <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold p-1 text-lg leading-none cursor-pointer">✕</button>
            </div>

            <div className="p-6 overflow-y-auto max-h-[85vh]">

              {/* ── View existing booking ── */}
              {targetBooking ? (
                <div className="space-y-4 text-xs font-sans">
                  <div className="bg-rose-50/75 border border-rose-100 rounded-xl p-4 space-y-3">
                    <div>
                      <span className="text-[8px]  font-bold uppercase tracking-wider text-rose-600 bg-rose-100/80 px-1.5 py-0.5 rounded border border-rose-200">กำลังใช้งาน</span>
                      <h5 className=" font-bold text-base text-slate-800 mt-2">{targetBooking.systemName}</h5>
                    </div>
                    <div className="grid grid-cols-2 gap-3 pt-2 border-t border-rose-200/40">
                      <div><span className="text-[10px] text-slate-400 block font-semibold">ผู้จอง</span><span className="font-bold text-slate-700">{targetBooking.teamName}</span></div>
                      <div><span className="text-[10px] text-slate-400 block font-semibold">อีเมล</span><span className="font-bold  text-slate-700 text-[10px] break-all">{targetBooking.userEmail}</span></div>
                    </div>
                    {/* [REQ-1] [REQ-3] แสดงช่วงเวลา dd/mm/yyyy hh:mm */}
                    <div className="pt-2 border-t border-rose-200/40">
                      <span className="text-[10px] text-slate-400 block font-semibold">ช่วงเวลา</span>
                      <span className="font-bold  text-slate-700 text-[11px]">{timeRangeLabel(targetBooking)}</span>
                    </div>
                    {targetBooking.equipment && (
                      <div className="pt-2 border-t border-rose-200/40">
                        <span className="text-[10px] text-slate-400 block font-semibold">อุปกรณ์ที่ใช้ทดสอบ</span>
                        <span className="font-bold text-rose-800 bg-rose-50 px-2 py-1 rounded border border-rose-200/70 block mt-1  text-[10px] w-fit">
                          🔌 {targetBooking.equipment}{targetBooking.matCode ? ` [${targetBooking.matCode}]` : ''}
                        </span>
                      </div>
                    )}
                    {targetBooking.notes && (
                      <div className="pt-2 border-t border-rose-200/40">
                        <span className="text-[10px] text-slate-400 block font-semibold">หมายเหตุ</span>
                        <p className="text-[10px] text-slate-600 italic bg-white p-2.5 border border-slate-100 rounded-lg mt-1 whitespace-pre-wrap">{targetBooking.notes}</p>
                      </div>
                    )}
                    {/* [REQ-1] createdAt format */}
                    {targetBooking.createdAt && (
                      <div className="pt-2 border-t border-rose-200/40">
                        <span className="text-[10px] text-slate-400 block font-semibold">สร้างเมื่อ</span>
                        <span className="text-[10px]  text-slate-500">{formatDateTimeDisplay(targetBooking.createdAt)}</span>
                      </div>
                    )}
                  </div>
                  <button onClick={() => handleDeleteBooking(targetBooking.id, targetBooking.userEmail)}
                    className="w-full text-center py-2.5 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl text-rose-600 font-bold transition-all cursor-pointer text-xs">
                    ยกเลิกคิวนี้
                  </button>
                </div>

              ) : (
                /* ── New booking form ── */
                <form onSubmit={handleSaveBooking} className="space-y-4 text-xs">
                  {modalError && (
                    <div className="p-3 bg-rose-50 border border-rose-100 rounded-xl text-rose-600 font-semibold flex items-start gap-1.5">
                      <AlertTriangleIcon className="w-4 h-4 shrink-0 text-rose-500 mt-0.5"/>
                      <span>{modalError}</span>
                    </div>
                  )}

                  {/* User info */}
                  <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-emerald-800 block font-semibold">เข้าสู่ระบบโดย</span>
                      <span className="font-bold text-slate-800 text-xs">{currentUser?.name}</span>
                    </div>
                    <span className="text-[9px]  bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded font-bold border border-emerald-300 uppercase">
                      {currentUser?.team?.split(' / ')[0]}
                    </span>
                  </div>
                  
                  {/* Project */}
                    <div className="space-y-2">
                      <label className="font-bold text-slate-700 block mb-1">เลือกโครงการที่ต้องการทดสอบ <span className="text-rose-500">*</span></label>
                      <select 
                        required={bookingProject !== 'OTHER'} 
                        value={bookingProject} 
                        onChange={e => {
                          setBookingProject(e.target.value);
                          if (e.target.value !== 'OTHER') setCustomProject(''); // เคลียร์ค่าที่พิมพ์ค้างไว้ถ้าเปลี่ยนกลับไปเลือกโปรเจกต์ปกติ
                        }}
                        className="w-full text-xs border border-slate-200 rounded-xl px-4 py-2.5 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/15"
                      >
                        <option value="">-- เลือกโครงการ --</option>
                        {(currentUser?.allowedProjects||[]).map(p => <option key={p} value={p}>{p}</option>)}
                        <option value="OTHER">➕ โครงการอื่นๆ (ระบุเอง)...</option>
                      </select>

                      {/* กล่องกรอกชื่อโครงการ จะแสดงก็ต่อเมื่อเลือก "OTHER" */}
                      {bookingProject === 'OTHER' && (
                        <div className="animate-fade-in-up mt-2">
                          <input 
                            type="text" 
                            required 
                            placeholder="พิมพ์ชื่อโครงการที่ต้องการ..." 
                            value={customProject}
                            onChange={e => setCustomProject(e.target.value)}
                            className="w-full text-xs border border-emerald-300 bg-emerald-50/50 rounded-xl px-4 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                          />
                        </div>
                      )}
                    </div>

                    {/* ── ช่องกรอกวัตถุประสงค์การใช้งาน (เพิ่มใหม่) ── */}
                      <div className="mb-4">
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          วัตถุประสงค์การใช้งาน <span className="text-red-500">*</span>
                        </label>
                        <textarea
                          required
                          value={bookingObjective}
                          onChange={(e) => setBookingObjective(e.target.value)}
                          className="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                          rows="2"
                          placeholder="โปรดระบุวัตถุประสงค์การใช้งาน... "
                        />
                      </div>

                  {/* [REQ-2] Manual Equipment + MatCode inputs (รองรับหลายรายการ) */}
                    <div className="p-3 bg-indigo-50/50 border border-indigo-100 rounded-xl space-y-3">
                      <div className="flex items-center justify-between">
                        <p className="text-[9px]  font-bold text-indigo-600 uppercase tracking-wide">🔌 อุปกรณ์ที่ใช้ทดสอบ (DUT)</p>
                        <button type="button" onClick={addDeviceRow} className="text-[9px] bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold hover:bg-indigo-200 transition-colors">
                          + เพิ่มอุปกรณ์
                        </button>
                      </div>
                      
                      <div className="space-y-2 max-h-[150px] overflow-y-auto custom-scrollbar pr-1">
                        {bookingDevices.map((dev, idx) => (
                          <div key={idx} className="flex items-start gap-2 bg-white p-2 rounded-lg border border-indigo-100/50 relative">
                            <div className="grid grid-cols-2 gap-2 flex-1">
                              <div>
                                <label className="text-[9px] font-bold text-slate-500 block mb-0.5">ชื่ออุปกรณ์ {idx + 1} <span className="text-rose-500">*</span></label>
                                <input type="text" required placeholder="เช่น SCADA PLC..." value={dev.equipment}
                                  onChange={e => updateDeviceField(idx, 'equipment', e.target.value)}
                                  className="w-full text-[10px] border border-slate-200 rounded px-2 py-1 text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500/30" />
                              </div>
                              <div>
                                <label className="text-[9px] font-bold text-slate-500 block mb-0.5">Mat.Code <span className="text-rose-500">*</span></label>
                                <input type="text" required placeholder="เช่น MAT-001..." value={dev.matCode}
                                  onChange={e => updateDeviceField(idx, 'matCode', e.target.value)}
                                  className="w-full text-[10px]  border border-slate-200 rounded px-2 py-1 text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500/30" />
                              </div>
                            </div>
                            {bookingDevices.length > 1 && (
                              <button type="button" onClick={() => removeDeviceRow(idx)} className="text-rose-400 hover:text-rose-600 p-1 mt-3">✕</button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                  {/* Time range */}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">เวลาเริ่มต้น <span className="text-rose-500">*</span></label>
                      <input type="time" required step="900" value={bookingStartTime}
                        onChange={e => setBookingStartTime(e.target.value)}
                        className="w-full text-xs border border-slate-200 rounded-xl px-4 py-2 text-slate-700  focus:outline-none focus:ring-2 focus:ring-emerald-500/15"/>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">เวลาสิ้นสุด <span className="text-rose-500">*</span></label>
                      <input type="time" required step="900" value={bookingEndTime}
                        onChange={e => setBookingEndTime(e.target.value)}
                        className="w-full text-xs border border-slate-200 rounded-xl px-4 py-2 text-slate-700  focus:outline-none focus:ring-2 focus:ring-emerald-500/15"/>
                    </div>
                  </div>

                  {/* [REQ-3] Multi-day end date */}
                  <div className="p-3 bg-sky-50/50 border border-sky-100 rounded-xl space-y-2">
                    <p className="text-[9px]  font-bold text-sky-600 uppercase tracking-wide">📅 จองข้ามวัน (ไม่บังคับ)</p>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">วันสิ้นสุด</label>
                      <input type="date" min={selectedDate} value={bookingEndDate}
                        onChange={e => setBookingEndDate(e.target.value)}
                        className="w-full text-xs border border-slate-200 rounded-xl px-4 py-2 text-slate-700  focus:outline-none focus:ring-2 focus:ring-sky-500/15"/>
                      <p className="text-[9px] text-slate-400 mt-1 font-sans">
                        วันเริ่มต้น: <strong className="text-emerald-600">{formatDateDisplay(selectedDate)}</strong>
                        {bookingEndDate && bookingEndDate !== selectedDate &&
                          <> → วันสิ้นสุด: <strong className="text-sky-600">{formatDateDisplay(bookingEndDate)}</strong> <span className="text-amber-500 font-bold">(จองข้ามวัน ✚)</span></>
                        }
                        {(!bookingEndDate || bookingEndDate === selectedDate) && <span className="text-slate-400"> (จองวันเดียว)</span>}
                      </p>
                    </div>
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">หมายเหตุ (ไม่บังคับ)</label>
                    <textarea placeholder="พารามิเตอร์ทดสอบ, อุณหภูมิ, การตั้งค่าพิเศษ..." value={bookingNotes} rows={2}
                      onChange={e => setBookingNotes(e.target.value)}
                      className="w-full text-xs border border-slate-200 rounded-xl px-4 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/15"/>
                  </div>

                  <div className="flex gap-2 justify-end pt-3 border-t border-slate-100">
                    <button type="button" onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 border border-slate-200 text-slate-500 rounded-xl hover:bg-slate-50 cursor-pointer text-xs">
                      ยกเลิก
                    </button>
                    <button type="submit" disabled={submitting}
                      className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl disabled:opacity-50 cursor-pointer shadow-md shadow-emerald-600/10 text-xs">
                      {submitting ? 'กำลังบันทึก...' : 'ยืนยันจองคิว'}
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ════════════════════ [REQ-4] ADMIN EDIT AREA MODAL ════════════════════ */}
      {isEditingArea && editAreaForm && (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
          <div className="bg-white rounded-2xl shadow-2xl border border-amber-200/50 max-w-lg w-full overflow-hidden animate-fade-in-up">

            <div className="px-6 py-4 border-b border-amber-100 bg-amber-50 flex items-center justify-between">
              <div>
                <h4 className=" font-bold text-amber-900 text-sm flex items-center gap-2">
                  <PencilIcon className="w-4 h-4 text-amber-600"/>
                  แก้ไขตู้อุปกรณ์: <span className="text-indigo-700">{editAreaForm.name}</span>
                </h4>
                <p className="text-[10px] text-amber-700 mt-0.5">🔐 สิทธิ์ Super Admin เท่านั้น — การเปลี่ยนแปลงจะบันทึกลง Google Sheets</p>
              </div>
              <button onClick={() => setIsEditingArea(false)} className="text-amber-500 hover:text-amber-800 cursor-pointer p-1">
                <XIcon className="w-5 h-5"/>
              </button>
            </div>

            <div className="p-6 overflow-y-auto max-h-[80vh] space-y-5 text-xs">

              {/* Responsible Team */}
              <div>
                <label className="font-bold text-slate-700 block mb-1.5">🛠️ ผู้รับผิดชอบ <span className="text-rose-500">*</span></label>
                <input type="text" required value={editAreaForm.responsibleTeam}
                  onChange={e => setEditAreaForm(p => ({ ...p, responsibleTeam: e.target.value }))}
                  className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500/20 font-sans text-xs"/>
              </div>

              {/* Info / Description */}
              <div>
                <label className="font-bold text-slate-700 block mb-1.5">📋 คำอธิบาย</label>
                <textarea value={editAreaForm.info} rows={2}
                  onChange={e => setEditAreaForm(p => ({ ...p, info: e.target.value }))}
                  className="w-full border border-slate-200 rounded-xl px-4 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500/20 text-xs"/>
              </div>

              {/* Equipment items list */}
              <div className="space-y-2">
                <label className="font-bold text-slate-700 block">📦 รายการอุปกรณ์ ({editAreaForm.items.length} รายการ)</label>

                <div className="space-y-1.5 max-h-[200px] overflow-y-auto custom-scrollbar pr-1">
                  {editAreaForm.items.map((item, idx) => (
                    <div key={idx} className="flex items-center gap-2 p-2 bg-slate-50 border border-slate-100 rounded-lg">
                      <span className="flex-1 text-slate-600 text-[11px]">{item}</span>
                      <button onClick={() => removeAreaItem(idx)}
                        className="text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded p-0.5 cursor-pointer transition-colors shrink-0">
                        <XIcon className="w-3.5 h-3.5"/>
                      </button>
                    </div>
                  ))}
                  {editAreaForm.items.length === 0 && (
                    <p className="text-[10px] text-slate-400 italic text-center py-3">ไม่มีรายการอุปกรณ์ — เพิ่มด้านล่าง</p>
                  )}
                </div>

                {/* Add new item */}
                <div className="flex gap-2 pt-1">
                  <input type="text" placeholder="ชื่ออุปกรณ์ใหม่..."
                    value={newItemInput} onChange={e => setNewItemInput(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addAreaItem())}
                    className="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500/20 font-sans"/>
                  <button onClick={addAreaItem}
                    className="px-3 py-2 bg-amber-500 hover:bg-amber-400 text-white rounded-xl text-xs font-bold cursor-pointer flex items-center gap-1 transition-all shrink-0">
                    <PlusIcon className="w-3.5 h-3.5"/> เพิ่ม
                  </button>
                </div>
              </div>

              <div className="flex gap-2 pt-3 border-t border-slate-100">
                <button onClick={() => setIsEditingArea(false)}
                  className="px-4 py-2 border border-slate-200 text-slate-500 rounded-xl hover:bg-slate-50 cursor-pointer text-xs">
                  ยกเลิก
                </button>
                <button onClick={saveAreaEdit} disabled={savingArea}
                  className="flex-1 px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold disabled:opacity-50 cursor-pointer shadow-md transition-all">
                  {savingArea ? 'กำลังบันทึก...' : '💾 บันทึกการเปลี่ยนแปลง'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── Extend Booking Modal ── */}
      {isExtendModalOpen && extendTargetBooking && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in border border-slate-200">
            <div className="bg-emerald-600 p-4 text-white">
              <h2 className=" font-bold text-lg flex items-center gap-2">
                ⏱️ ต่อเวลาการใช้งาน
              </h2>
              <p className="text-[10px] text-emerald-100 mt-1">
                ระบุวันที่และเวลาสิ้นสุดใหม่ สำหรับโต๊ะ {extendTargetBooking.deskId}
              </p>
            </div>
            
            <form onSubmit={handleExtendSubmit} className="p-5 space-y-4">
              {extendError && (
                <div className="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl">
                  {extendError}
                </div>
              )}
              
              <div className="grid grid-cols-2 gap-3">
                <div className="space-y-1.5">
                  <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">วันที่สิ้นสุด (ใหม่)</label>
                  <input type="date" required
                    value={extendEndDate}
                    min={extendTargetBooking.date}
                    onChange={e => setExtendEndDate(e.target.value)}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500/50 outline-none transition-all"
                  />
                </div>
                <div className="space-y-1.5">
                  <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">เวลาสิ้นสุด (ใหม่)</label>
                  <input type="time" required
                    value={extendEndTime}
                    onChange={e => setExtendEndTime(e.target.value)}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500/50 outline-none transition-all"
                  />
                </div>
              </div>

              {/* 📌 ช่องกรอกเหตุผลที่เพิ่มเข้ามาใหม่ */}
              <div className="space-y-1.5 pt-1">
                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">
                  เหตุผล / วัตถุประสงค์ในการต่อเวลา <span className="text-rose-500">*</span>
                </label>
                <input type="text" required
                  value={extendReason}
                  onChange={e => setExtendReason(e.target.value)}
                  placeholder="เช่น รันทดสอบยังไม่จบ, เก็บ Log เพิ่ม..."
                  className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500/50 outline-none transition-all"
                />
              </div>

              <div className="flex gap-2 pt-3">
                <button type="button" onClick={() => setIsExtendModalOpen(false)}
                  className="px-4 py-2 border border-slate-200 text-slate-500 rounded-xl hover:bg-slate-50 text-sm font-bold flex-1 transition-all">
                  ยกเลิก
                </button>
                <button type="submit" disabled={extendSubmitting}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold disabled:opacity-50 flex-1 shadow-md shadow-emerald-500/20 transition-all flex justify-center items-center">
                  {extendSubmitting ? (
                    <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"/>
                  ) : 'บันทึกเวลาใหม่'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Footer */}
      <footer className="bg-slate-900 border-t border-slate-800 text-center py-8 text-[11px] text-slate-400 mt-12">
        <div className=" font-medium text-slate-300">OMA LAB ROOM by Parichat Sumrit</div>
      </footer>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
