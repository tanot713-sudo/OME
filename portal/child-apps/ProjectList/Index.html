<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --red:#DC2828; --red-dk:#B91C1C; --red-soft:#FEF2F2; --red-line:#FBD5D5;
  --ink:#101317; --ink-2:#3C434F; --muted:#6B7280; --faint:#9CA3AF;
  --bg:#F6F7F9; --panel:#FFFFFF; --line:#EAECEF; --line-2:#F1F2F4;
  --green:#16A249; --green-soft:#E9FBEF;
  --amber:#E08600; --amber-soft:#FFF7EA;
  --blue:#2563EB; --blue-soft:#EEF3FE;
  --slate:#64748B; --slate-soft:#F1F3F6;
  --teal:#14B8C4; --purple:#7C6BE0;
  --r:18px; --r-md:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(16,19,23,.04), 0 2px 6px rgba(16,19,23,.04);
  --sh-md:0 4px 16px rgba(16,19,23,.07);
  --sh-lg:0 16px 40px rgba(16,19,23,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;padding-bottom:60px}
.dsp{font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.wrap{max-width:100%;margin:0 auto;padding:0 32px}
.top{background:var(--bg);padding:12px 0 6px;position:sticky;top:0;z-index:60}
.top .row{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.top .mark{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:11px;
  background:linear-gradient(135deg,var(--red),#F0584F);font-family:'Plus Jakarta Sans';font-weight:800;font-size:17px;
  letter-spacing:.5px;color:#fff;box-shadow:0 6px 16px rgba(220,40,40,.28)}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.1;color:var(--ink)}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.top .spacer{flex:1}
.top .stamp{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);justify-content:start;gap:3px;padding-top:4px;padding-bottom:11px}
.tab{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;padding:7px 8px 8px;cursor:pointer;position:relative;top:1px;transition:.18s;white-space:nowrap;border:1.5px solid transparent;border-bottom:none;border-radius:9px 9px 0 0;box-shadow:1px -1px 4px rgba(16,19,23,.08)}
.tab .tab-ic{display:inline-flex;opacity:.9}.tab .tab-ic svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;display:block}
/* unselected: white -> own soft colour gradient (same as selected), no border */
.tab.mt-status{color:#fff;background:#3B82F6;border-color:transparent}
.tab.mt-action{color:#fff;background:#EF4444;border-color:transparent}
.tab.mt-bond{color:#fff;background:#8B5CF6;border-color:transparent}
.tab.mt-closure{color:#fff;background:#F5A623;border-color:transparent}
.tab.mt-trends{color:#fff;background:#14B8A6;border-color:transparent}
.tab{opacity:1}
.tab:not(.on){filter:saturate(.92) brightness(1.04)}
.tab:hover{filter:none}
/* active tab = solid underline in the tab's own colour (no lift) */
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:3px;border-radius:2px}
.tab.mt-status.on{background:#2563EB} .tab.mt-status.on::after{background:#2563EB}
.tab.mt-action.on{background:#DC2626} .tab.mt-action.on::after{background:#DC2626}
.tab.mt-bond.on{background:#7C3AED} .tab.mt-bond.on::after{background:#7C3AED}
.tab.mt-closure.on{background:#E8940E} .tab.mt-closure.on::after{background:#E8940E}
.tab.mt-trends.on{background:#0D9488} .tab.mt-trends.on::after{background:#0D9488}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:11px;margin-bottom:4px}
.sec-h h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sec .lead{font-size:12.5px;color:var(--muted);margin-bottom:16px;max-width:780px;line-height:1.55}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel .ph{padding:15px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line-2)}
.panel .ph .ic{width:30px;height:30px;border-radius:9px;background:var(--red-soft);display:grid;place-items:center;flex-shrink:0}
.panel .ph .ic svg{width:16px;height:16px;stroke:var(--red);stroke-width:2;fill:none}
.panel .ph h3{font-size:14.5px;font-weight:800;letter-spacing:-.3px}

.panel .ph .hint{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:600}
/* themed HTML chart tooltip — floats above the page with a real shadow */
.oma-tt{position:absolute;z-index:9999;pointer-events:none;opacity:0;background:#1F2430;border:1px solid #2E3646;border-radius:12px;box-shadow:0 12px 32px rgba(16,19,23,.32);padding:10px 14px;transform:translate(-50%,calc(-100% - 12px));transition:opacity .14s ease,left .1s ease-out,top .1s ease-out;font-family:'Inter',system-ui,sans-serif;max-width:340px;white-space:normal}
.oma-tt::after{content:'';position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#1F2430;border-right:1px solid #2E3646;border-bottom:1px solid #2E3646;transform:translateX(-50%) rotate(45deg)}
.oma-tt-t{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-weight:800;color:#fff;letter-spacing:-.2px;margin-bottom:6px;white-space:normal;line-height:1.4}

.oma-tt-k{flex:1;white-space:nowrap}

.oma-tt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.oma-tt-f{font-size:10.5px;font-weight:600;color:#94A0B4;margin-top:6px;padding-top:6px;border-top:1px dashed #39435626}

.ev-nav{display:inline-flex;align-items:center;gap:8px}

.hdr-legend{display:inline-flex;align-items:center;gap:16px}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 17px;min-height:140px;display:flex;flex-direction:column;
  box-shadow:var(--sh);position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--slate)}
.kpi.g::before{background:#E03E3E} .kpi.a::before{background:#1FB888}
.kpi.b::before{background:#8B5CF6} .kpi.r::before{background:var(--ink-2)}

.kpi.g .kic{background:#FDECEC;color:#E03E3E} .kpi.a .kic{background:#E5F8F1;color:#0F9968}
.kpi.b .kic{background:#E8F1FE;color:#1D6FE0} .kpi.r .kic{background:#EEF0F3;color:var(--ink-2)}
.kpi .kic svg{width:15px;height:15px;stroke-width:2;fill:none;stroke:currentColor}
.kpi .kv{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.cl-clearpop{display:inline-flex;align-items:center;gap:7px;height:34px;box-sizing:border-box;padding:0 10px 0 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:var(--red);background:var(--red-soft);border:1px solid #F3C6C6;border-radius:var(--r-sm);cursor:pointer;transition:.15s;white-space:nowrap;animation:clearpop .22s cubic-bezier(.34,1.56,.64,1)}

<script>
var DATA=null, TODAY=new Date();
// ซ่อนแท็บที่ role นี้ไม่มีสิทธิ์เห็น (ตั้งค่าจากหน้า "ตั้งค่าสิทธิ์" ของ Portal Hub)
// allowedSections เป็น null/undefined = ไม่ถูกจำกัดเลย แสดงทุกแท็บเหมือนเดิม
var TAB=(function(){
  var as=window.PORTAL&&window.PORTAL.allowedSections;
  if(!as)return'overview';
  var order=['overview','frontlog','action','closure','trends'];
  for(var i=0;i<order.length;i++)if(as.indexOf(order[i])!==-1)return order[i];
  return'overview';
})();
// Clean white "finance-app" tooltips for every chart — rendered as HTML so they can
// float above the page with a real shadow (canvas tooltips cannot cast shadows).
function omaTooltip(context){
  var tooltip=context.tooltip, chart=context.chart;
  var el=document.getElementById('oma-tt');
  if(!el){ el=document.createElement('div'); el.id='oma-tt'; el.className='oma-tt'; document.body.appendChild(el); }
  if(!tooltip || tooltip.opacity===0){ el.style.opacity=0; return; }
  var html='';
  var title=(tooltip.title||[]).filter(function(t){return t;}).join(' ');
  if(title){ html+='<div class="oma-tt-t">'+esc(title)+'</div>'; }
  (tooltip.beforeBody||[]).forEach(function(line){ if(line) html+='<div class="oma-tt-l">'+esc(line)+'</div>'; });
  (tooltip.body||[]).forEach(function(b,i){
    var col=(tooltip.labelColors&&tooltip.labelColors[i])?tooltip.labelColors[i].backgroundColor:null;
    var dotColor=(typeof col==='string')?col:(col?'#1E3A8A':null);   // non-string fill -> navy dot
    var dot=dotColor?'<span class="oma-tt-dot" style="background:'+dotColor+'"></span>':'';
    (b.lines||[]).forEach(function(line){
      // split "Label: value" so the values align in their own column
      var str=String(line), i=str.indexOf(':');
      var body=(i>0)
        ? '<span class="oma-tt-k">'+esc(str.slice(0,i))+'</span><span class="oma-tt-v">'+esc(str.slice(i+1).trim())+'</span>'
        : esc(str);
      html+='<div class="oma-tt-l">'+dot+body+'</div>';
    });
  });
  var foot=(tooltip.afterBody||[]).concat(tooltip.footer||[]).filter(function(t){return t;});
  foot.forEach(function(line){ html+='<div class="oma-tt-f">'+esc(line)+'</div>'; });
  el.innerHTML=html;
  var r=chart.canvas.getBoundingClientRect();
  el.style.opacity=1;
  el.style.left=(r.left+window.scrollX+tooltip.caretX)+'px';
  el.style.top=(r.top+window.scrollY+tooltip.caretY)+'px';
}
if(typeof Chart!=='undefined'){
  Chart.defaults.plugins.tooltip.enabled=false;      // built-in canvas tooltip off
  Chart.defaults.plugins.tooltip.external=omaTooltip; // themed HTML tooltip on
}
function fmtB(n){ return Number(Math.round(n)).toLocaleString('en-US'); }
function fmtB2(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
// Compact amount for narrow cells: 1.68M, 82.6K, 950
function fmtB0(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M'; if(n>=1e3) return (n/1e3).toFixed(n>=1e5?0:0)+'K'; return String(Math.round(n)); }
function fmtM(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtMB(n){ return (n/1e6).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' MB'; }
function mbNum(n){ return (n/1e6).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function typeKey(t){ return t==='Maintenance'?'ma':t==='Warranty'?'war':(t==='PPA'||t==='Investment')?'ppa':'add'; }
function typeLabel(t){ return (t==='PPA'||t==='Investment')?'Investment':t==='Additional work'?'Additional':t; }
function typeColor(t){ return {ma:'#E03E3E',war:'#2D7FF0',ppa:'#1FB888',add:'#64748B'}[typeKey(t)]; }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function enDate(iso){ if(!iso) return '—'; var p=iso.split('-'); return Number(p[2])+' '+MON[Number(p[1])-1]+' '+p[0]; }
function enDateShort(iso){ if(!iso) return ''; var p=iso.split('-'); return Number(p[2])+' '+MON[Number(p[1])-1]+' '+p[0].substring(2); }
// ---- Closure Tracking helpers ----
// Subject -> which side owns the follow-up. Two spellings of the warehouse subject are
// accepted ("Project Inventory" in raw / "Remaining Project Stock" as agreed).
var CLOSURE_ENDED_SUBJECTS = ['Billing','Collections','Collection','Customer Retention','Project Inventory','Remaining Project Stock','Bank Guarantees','Bank Guarantee'];
var CLOSURE_PENDING_SUBJECTS = ['Purchase Orders','Vendor Payables','Vendor Outstanding','Vendor Advances','Vendor Advance Payment','Vendor Retention'];
// Subject -> reviewer department (fallback when the sheet's Reviewer cell is blank).
var SUBJECT_REVIEWER = {
  'Purchase Orders':'Procurement',
  'Project Inventory':'Warehouse','Remaining Project Stock':'Warehouse',
  'Billing':'Finance','Collections':'Finance','Collection':'Finance','Customer Retention':'Finance',
  'Bank Guarantees':'Finance','Bank Guarantee':'Finance',
  'Vendor Payables':'Accounting','Vendor Outstanding':'Accounting',
  'Vendor Advances':'Accounting','Vendor Advance Payment':'Accounting','Vendor Retention':'Accounting'
};
// Display label for the warehouse subject regardless of how it was typed in the sheet.
function closureSubjectLabel(s){
  if(s==='Project Inventory') return 'Remaining Project Stock';
  if(s==='Bank Guarantees'||s==='Bank Guarantee') return 'Bond';
  return s;
}
// Only rows explicitly flagged Outstanding = Yes are open issues.
function closureOpenItems(p){
  return (p.closure||[]).filter(function(c){ return String(c.outstanding||'').toLowerCase()==='yes'; });
}
function reviewerOf(c){ return c.reviewer || SUBJECT_REVIEWER[c.subject] || '—'; }
// A project is "in closure" when it has at least one outstanding issue and is not yet Closed.
function hasOpenClosure(p){ return p.statusERP!=='Closed' && closureOpenItems(p).length>0; }
function statusLabel(p){
  if(p.statusContract==='Active') return {cls:'active',txt:'Active'};
  if(p.statusERP==='Closed') return {cls:'closed',txt:'Project Closed'};
  // Contract ended, not yet closed. Split by what is still outstanding in Closure Tracking:
  //  - customer / warehouse / BG issues  -> OMA must clear it itself  -> Contract Ended in Process
  //  - PO/WO or vendor issues            -> waiting on another party  -> Pending Closure
  //  - issues on BOTH sides              -> Contract Ended in Process first (OMA must expedite)
  var open=closureOpenItems(p);
  if(open.length){
    var hasEnded=open.some(function(c){ return CLOSURE_ENDED_SUBJECTS.indexOf(c.subject)>=0; });
    if(hasEnded) return {cls:'ended',txt:'Contract Ended in Process'};
    return {cls:'wait',txt:'Pending Closure'};
  }
  // No Closure Tracking rows yet -> fall back to the ERP status mapping.
  if(p.statusERP==='Transfer') return {cls:'wait',txt:'Pending Closure'};
  return {cls:'ended',txt:'Contract Ended in Process'};
}
function docStatus(p){ return p.statusERP==='Closed'?'Closed':(p.statusERP==='Transfer'?'Transfer':'Open'); }
function leaderTxt(l){ return (!l||l==='Unassigned'||l==='-'||l==='ยังไม่ระบุ'||l==='ไม่ระบุ')?'':l; }
function typeOrder(t){ var k=typeKey(t); return {ma:0,war:1,ppa:2,add:3}[k]; }
function sortByTypeThenEnd(arr){ return arr.sort(function(a,b){ var to=typeOrder(a.type)-typeOrder(b.type); if(to!==0) return to; return new Date(a.end||'2099-01-01')-new Date(b.end||'2099-01-01'); }); }
google.script.run
  .withSuccessHandler(function(d){ DATA=d; init(); })
  .withFailureHandler(function(e){ document.getElementById('app').innerHTML='<div class="empty">Failed to load: '+esc(e.message)+'</div>'; })
  .getDashboardData(window.PORTAL && window.PORTAL.token);
function init(){
  // Safety net: never show/count Gold Line / Green Line outliers anywhere
  if(DATA&&DATA.projects){ DATA.projects=DATA.projects.filter(function(p){ var n=String(p.name||''); return !(/gold\s*line/i.test(n)||/green\s*line/i.test(n)); }); }
  var g=DATA.generatedAt?new Date(DATA.generatedAt):new Date();
  document.getElementById('stamp').textContent='Updated '+g.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('ov').addEventListener('click',function(e){ if(e.target.id==='ov') closeModal(); });
  var exp=document.getElementById('f-export'); if(exp) exp.addEventListener('click',exportCSV);
  var hexp=document.getElementById('hdr-export'); if(hexp) hexp.addEventListener('click',exportCSV);
  kxTipInit();
  syncStickyOffset();
  window.addEventListener('resize',syncStickyOffset);
  renderTabs(); renderTab();
}
// Measure the sticky header's real height so the tab bar parks exactly beneath it
// (height changes with viewport / when the header row wraps, so never hard-code it).
function syncStickyOffset(){
  var top=document.querySelector('.top');
  if(top) document.documentElement.style.setProperty('--topH',top.offsetHeight+'px');
}
var F={ year:'', type:'', pm:'', customer:'', ref:'', search:'', status:'Active', statusTouched:false };
// When the user narrows by Year/In Charge/Customer/Ref (but hasn't manually set Status),
// widen Status to All so projects whose work has already ended still show. With no narrowing
// and no manual Status, fall back to the default Active (current-work) view.
function syncAutoStatus(){
  if(F.statusTouched) return;
  // An event selection counts as narrowing too: clicking "End of Contract · Mar" asks about
  // work that has, by definition, already ended — leaving Status on Active would hide every
  // project the bar counted.
  var narrowed = F.year||F.pm||F.customer||F.ref||EV_SEL;
  F.status = narrowed ? '' : 'Active';
}
// ===== Unified filter system =====
// Returns true if a project passes a given set of filter dimensions.
function matchYear(p){ return !F.year || String(p.startYear)===F.year || String(p.endYear)===F.year; }
function matchType(p){ return !F.type || typeKey(p.type)===typeKey(F.type); }
function matchPM(p){ return !F.pm || (leaderTxt(p.leader)===F.pm); }
function matchCustomer(p){ return !F.customer || p.customer===F.customer; }
function matchRef(p){ if(!F.ref) return true; return String(p.ref||'')===F.ref; }
// Frontlog items live outside DATA.projects, so they get their own filter pass
// honouring the same descriptive filters (in-charge / customer / ref / search).
// The In Charge filter matches OMA_In_Charge (the OMA person who will receive the
// work) — the implementation PM is a different person and is searchable instead.
function flPass(f){
  if(F.pm && leaderTxt(f.omaInCharge)!==F.pm) return false;
  if(F.customer && f.owner!==F.customer) return false;
  if(F.ref && String(f.ref||'')!==F.ref) return false;
  if(F.search){
    var q=F.search.toLowerCase();
    var hay=[f.name,f.owner,f.ref,f.pm,f.omaInCharge,f.handover,f.note].join(' ').toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
// A frontlog item whose Event_Date has already passed (day-level) and is still not
// transferred is DELAYED. It stays plotted in its ORIGINAL month — the chart shows it
// as a striped segment and the popup tags it "Delayed".
function flDelayed(f){
  if(!f.eventDate) return false;
  var d=new Date(f.eventDate);
  var t0=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
  return d<t0;   // strictly before today; due today still counts as on track
}
// Plan state of a frontlog row: 'done' (transferred to OMA), 'late', or 'plan' (on track).
// A handover can be recorded three ways; any one of them counts as Transferred.
// Transferred_Date is the primary one — Handover_Status is a formula that only ever
// returns On Track / Delayed, so it can never hold "Transferred" on its own.
function flTransferred(f){
  if(!f) return false;
  if(f.transferred) return true;
  if(f.transferredDate) return true;
  return /transferred|hand(?:ed)?\s*over|done|completed|โอนแล้ว|รับโอน|ส่งมอบแล้ว/i.test(String(f.handover||'')+' '+String(f.note||''));
}
// Which month a row belongs to: its Expected_Warranty_In_Date, ALWAYS. A row never moves —
// not when it slips, not when it finally arrives — so last month's screenshot still matches
// this month's chart and no number ever changes behind the reader's back. The day a handover
// actually happened is told by the strip above the Events chart, not by moving a bar.
function flPlotDate(f){ return f?f.eventDate:null; }
function flState(f){
  if(flTransferred(f)) return 'done';
  return flDelayed(f)?'late':'plan';
}
function matchSearch(p){
  if(!F.search) return true;
  var q=F.search.toLowerCase();
  // search across every value in the project record (plus its bonds)
  var hay='';
  for(var k in p){ if(!p.hasOwnProperty(k)) continue; var v=p[k];
    if(v==null) continue;
    if(typeof v==='object'){ try{ hay+=' '+JSON.stringify(v); }catch(e){} }
    else hay+=' '+v;
  }
  return hay.toLowerCase().indexOf(q)!==-1;
}
function matchStatus(p){
  if(!F.status) return true; // All
  if(F.status==='Active') return p.statusContract==='Active';
  if(F.status==='Closed') return p.statusERP==='Closed';
  // Ended vs Pending follow the same Closure-Tracking-aware rule as the pill.
  if(F.status==='Ended') return p.statusContract!=='Active' && p.statusERP!=='Closed' && statusLabel(p).txt==='Contract Ended in Process';
  if(F.status==='Pending') return p.statusContract!=='Active' && p.statusERP!=='Closed' && statusLabel(p).txt==='Pending Closure';
  if(F.status==='WaitClose') return p.statusContract!=='Active' && p.statusERP!=='Closed'; // legacy = both
  return true;
}
// Clicking a bar on Project Events narrows the rest of the Overview to exactly the projects
// that bar counted. The Events chart itself never applies this (it would collapse to the one
// bar you clicked), and neither does the detail table underneath, which already filters
// itself by month + kind. Frontlog (kind 3) is excluded: those rows live on their own sheet
// and are not DATA.projects, so filtering by them would empty every panel.
function evSelYear(){ return window._evYear || (F.year?parseInt(F.year,10):(DATA.monthlyEvents&&DATA.monthlyEvents.year)) || TODAY.getFullYear(); }
function matchEvent(p){
  if(!EV_SEL || EV_SEL.ki===3) return true;
  var d=(EV_SEL.ki===0)?p.start:(EV_SEL.ki===1?p.end:p.closed);
  if(!d) return false;
  return Number(String(d).substring(0,4))===evSelYear() && Number(String(d).substring(5,7))===EV_SEL.mo;
}
function evSelLabel(){
  if(!EV_SEL) return '';
  var K=['New Contract','End of Contract','Closed','Frontlog'];
  return K[EV_SEL.ki]+' · '+MON[EV_SEL.mo-1]+' '+evSelYear();
}
// Main filter — applies ALL dimensions (used by KPI, Events, Customer, Gantt, Action Center, table)
function filterAll(p){ if(!matchEvent(p)) return false; if(F.search) return matchSearch(p)&&matchYear(p)&&matchType(p)&&matchPM(p)&&matchCustomer(p)&&matchRef(p); return matchYear(p)&&matchType(p)&&matchPM(p)&&matchCustomer(p)&&matchRef(p)&&matchStatus(p); }
function fpAll(){ return DATA.projects.filter(filterAll); }
// In Charge pie — reacts to In Charge/Customer/Ref/Type but NOT Year/Status (keeps active-only for data integrity)
function fpForPie(){
  // Default (no In Charge/Customer/Ref/Year filter): show current active work only.
  // When any of those dimensions is set, broaden to every project WITH a named PM that matches
  // (so e.g. selecting a customer whose projects have all ended still shows the responsible PM).
  var narrowed = F.pm||F.customer||F.ref||F.year||EV_SEL;
  return DATA.projects.filter(function(p){
    if(!leaderTxt(p.leader)) return false;                 // never include unnamed old projects
    if(!matchEvent(p)) return false;
    if(!(matchType(p)&&matchPM(p)&&matchCustomer(p)&&matchRef(p)&&matchYear(p))) return false;
    if(!narrowed && p.statusContract!=='Active') return false; // default view = active only
    return true;
  });
}

    '<span class="kx-row-n" title="'+esc(name)+'">'+esc(name)+'</span>'+

// ===== Frontlog tab: implementation projects handing over to OMA (warranty-in) =====
// Full-year view honouring the shared year filter + descriptive filters (in-charge /
// customer / ref / search). Same state model as the Overview Frontlog chart:
//   'plan' On Track  ·  'late' Delayed (Expected date passed, not transferred)  ·  'done' Transferred.
// Items plot in their ORIGINAL month and never roll forward.
// Frontlog Timeline — same idea as the Overview timeline: one bar per project spanning
// Start_Date → latest expected end (Update_End_Date, falling back to End_Date), coloured
// by work group so the mix is readable at a glance. The legend doubles as a group filter.
function flGroupOf(f){ var m=String(f.ref||'').match(/^([A-Za-z]+)/); return m?m[1].toUpperCase():'—'; }
function flTimelinePanel(rows,grpRows,colors){
  // `colors` is the stable group->colour map, so a group never changes colour when filtered
  var colorOf=colors;
  var items=rows.filter(function(f){ return f.startDate && (f.updateEnd||f.endDate); })
    .sort(function(a,b){ return String(a.startDate).localeCompare(String(b.startDate)); });
  var legend='<span class="fltl-hint"><span class="fltl-legend">'+grpRows.map(function(g){
    var on=(FL_FILTER.type==='group'&&FL_FILTER.val===g.k);
    return '<span class="fltl-lg'+(on?' on':'')+'" onclick="flFilter(\'group\',\''+esc(String(g.k)).replace(/'/g,"\\'")+'\')"><i style="background:'+colorOf[g.k]+'"></i>'+esc(g.k)+'</span>';
  }).join('')+'</span></span>';
  if(!items.length) return panel('gantt','Project Timeline (Frontlog)','<div class="empty">No projects with a start date</div>',legend);
  var min=null,max=null;
  items.forEach(function(f){
    var s=new Date(f.startDate).getTime(), e=new Date(f.updateEnd||f.endDate).getTime();
    if(min===null||s<min) min=s; if(max===null||e>max) max=e;
  });
  var t=TODAY.getTime();
  if(t<min) min=t; if(t>max) max=t;
  // snap the window to whole months so bars never touch the panel edges
  var dMin=new Date(min), dMax=new Date(max);
  min=new Date(dMin.getFullYear(),dMin.getMonth(),1).getTime();
  max=new Date(dMax.getFullYear(),dMax.getMonth()+1,1).getTime();
  var span=Math.max(max-min,86400000);
  var pct=function(ms){ return (ms-min)/span*100; };
  // adaptive ticks: pick the smallest step whose labels still fit the lane
  var totalMonths=Math.max(Math.round(span/2629800000),1);
  var laneW=Math.max((window.innerWidth||1400)-560,320);
  var pxPerMonth=laneW/totalMonths;
  var step=[1,2,3,6,12].filter(function(s){ return pxPerMonth*s>=92; })[0]||12;
  var yearOnly=(step===12);
  var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var cur=new Date(min);
  cur=new Date(cur.getFullYear(),cur.getMonth(),1);
  if(step===3){ while([0,3,6,9].indexOf(cur.getMonth())<0) cur.setMonth(cur.getMonth()+1); }
  else if(step===6){ while([0,6].indexOf(cur.getMonth())<0) cur.setMonth(cur.getMonth()+1); }
  else if(step===12){ while(cur.getMonth()!==0) cur.setMonth(cur.getMonth()+1); }
  var ticks=[];
  while(cur.getTime()<=max){ ticks.push(new Date(cur)); cur.setMonth(cur.getMonth()+step); }
  var axis=ticks.map(function(d){ var lb=yearOnly?String(d.getFullYear()):(MONS[d.getMonth()]+' '+String(d.getFullYear()).slice(2)); return '<div class="fltl-tick" style="left:'+pct(d.getTime())+'%"><span>'+lb+'</span></div>'; }).join('');
  var grid=ticks.map(function(d){ return '<div class="fltl-grid" style="left:'+pct(d.getTime())+'%"></div>'; }).join('');
  var rowsHtml=items.map(function(f){
    var sMs=new Date(f.startDate).getTime(), eIso=f.updateEnd||f.endDate, eMs=new Date(eIso).getTime();
    var g=flGroupOf(f), c=colorOf[g]||'#64748B';
    var l=pct(sMs), w=Math.max(pct(eMs)-l,0.6);
    // Same rule as Project Timeline: the fill is TIME ELAPSED, derived from the dates
    // themselves, so it stays correct without any manual %Progress update.
    var tNow=TODAY.getTime();
    var el=(eMs>sMs)?Math.max(0,Math.min(1,(tNow-sMs)/(eMs-sMs))):(tNow>=eMs?1:0);
    var st=flState(f);
    if(st==='done') el=1;   // handed over -> the bar is complete
    var stTxt=st==='done'?'Transferred':(st==='late'?'Delayed':'On Track');
    var tip=esc((f.ref?f.ref+' · ':'')+f.name)+'|'+enDate(f.startDate)+' → '+enDate(eIso)+' · '+stTxt;
    // clicking a row narrows the whole tab to that one project; the legend above still
    // filters by work group
    var rSel=(FL_FILTER.type==='proj'&&FL_FILTER.val===String(f.ref||''));
    return '<div class="fltl-row flg-clk'+(rSel?' on':'')+'" onclick="flFilter(\'proj\',\''+esc(String(f.ref||'')).replace(/'/g,"\\'")+'\')">'+
      '<div class="fltl-lbl" data-tip="'+esc((f.ref?f.ref+' · ':'')+f.name)+'|'+esc(f.owner||'—')+'">'+
        '<span class="fltl-code">'+esc(f.ref||'—')+'</span>'+
        '<span class="fltl-proj" title="'+esc(f.name)+'">'+esc(f.name)+'</span>'+
        '<span class="fltl-name" title="'+esc(f.owner||'')+'">'+esc(f.owner||'—')+'</span>'+
      '</div>'+
      '<div class="fltl-lane">'+
        '<div class="fltl-bar" data-tip="'+tip+'" style="left:'+l+'%;width:'+w+'%;background:'+c+'26">'+

// ===== Work arriving into OMA =====
// Not every project reaches OMA through the Frontlog: MA contracts are signed and start
// straight away, and older work was registered directly. So the month's arrivals are read
// from the Project List's Handover Date — the one place EVERY arrival is recorded — and the
// Frontlog is used only to add what it alone knows: the date the handover was expected.
// A Frontlog row that has been handed over but not yet registered is included too, so
// nothing quietly goes missing while the paperwork catches up.
var _PBYREF=null;
function projByRef(ref){
  if(!_PBYREF){ _PBYREF={}; (DATA.projects||[]).forEach(function(p){ var r=String(p.ref||'').trim(); if(r&&!_PBYREF[r]) _PBYREF[r]=p; }); }
  return _PBYREF[String(ref||'').trim()]||null;
}
var _FLBYREF=null;
function frontlogByRef(ref){
  if(!_FLBYREF){ _FLBYREF={}; (DATA.frontlog||[]).forEach(function(f){ var r=String(f.ref||'').trim(); if(r&&!_FLBYREF[r]) _FLBYREF[r]=f; }); }
  return _FLBYREF[String(ref||'').trim()]||null;
}
function sameMonth_(iso,d){
  if(!iso) return false;
  var x=new Date(iso);
  return x.getFullYear()===d.getFullYear() && x.getMonth()===d.getMonth();
}
// "12 M" alone never says WHEN cover lapses. Prefer the registered contract end (the real
// answer); fall back to counting the stated months off the contract start.
function addMonthsISO_(iso,n){
  if(!iso||!n) return null;
  var d=new Date(iso), day=d.getDate();
  var t=new Date(d.getFullYear(),d.getMonth()+n,1);
  t.setDate(Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));
  var mm=('0'+(t.getMonth()+1)).slice(-2), dd=('0'+t.getDate()).slice(-2);
  return t.getFullYear()+'-'+mm+'-'+dd;
}
// One arrival, however it got here. src: 'frontlog' (it was in the pipeline) | 'direct'.
function hzRecord_(p,f){
  var period=(p&&p.period)||(f&&f.warranty)||'';
  var mo=parseInt(String(period).replace(/[^0-9]/g,''),10);
  var cStart=p?(p.start||null):null;
  var actual=(p&&p.handoverDate)||(f&&f.transferredDate)||null;
  var cEnd=(p&&p.end)||addMonthsISO_(cStart||actual,mo);
  var early=(cStart&&actual)?Math.round((new Date(actual).getTime()-new Date(cStart).getTime())/86400000):0;
  return {
    ref:(p&&p.ref)||(f&&f.ref)||'',
    name:(p&&p.name)||(f&&f.name)||'',
    customer:(p&&p.customer)||(f&&f.owner)||'',
    type:p?(p.type||''):'',
    value:(p&&p.value)||(f&&f.value)||0,
    expected:f?(f.eventDate||null):null,
    actual:actual, cStart:cStart, cEnd:cEnd, period:period,
    early:early>0?early:0,
    src:f?'frontlog':'direct'
  };
}
// Arrivals during the CURRENT CALENDAR MONTH, newest first. A calendar month is what people
// mean by "this month", and it matches how every other chart here buckets its data.
function flRecentReceived(){
  var out=[], seen={};
  (DATA.projects||[]).forEach(function(p){
    if(!p.handoverDate || !sameMonth_(p.handoverDate,TODAY)) return;
    var f=frontlogByRef(p.ref);
    if(f && !flPass(f)) return;
    var r=String(p.ref||'').trim();
    if(r) seen[r]=1;
    out.push(hzRecord_(p,f));
  });
  (DATA.frontlog||[]).forEach(function(f){
    if(!flTransferred(f) || !f.transferredDate || !flPass(f)) return;
    if(!sameMonth_(f.transferredDate,TODAY)) return;
    var r=String(f.ref||'').trim();
    if(r && seen[r]) return;                    // already counted from the Project List
    var p=projByRef(f.ref);
    if(p && p.handoverDate) return;             // registered under a different month
    if(r) seen[r]=1;
    out.push(hzRecord_(p,f));
  });
  return out.sort(function(a,b){ return String(b.actual).localeCompare(String(a.actual)); });
}
// Type mix of a set of arrivals, as the same capsules used everywhere else.
function flTypeBreak(list){
  var by={};
  list.forEach(function(x){ by[x.type||'?']=(by[x.type||'?']||0)+1; });
  var order=['Maintenance','Warranty','Investment','PPA','Additional work'];
  var seen={}, out=[];
  order.forEach(function(t){ if(by[t]){ seen[t]=1; out.push(typePill(t)+'<span class="st-n">'+by[t]+'</span>'); } });
  Object.keys(by).forEach(function(t){ if(t==='?'||seen[t]) return; out.push(typePill(t)+'<span class="st-n">'+by[t]+'</span>'); });
  if(by['?']) out.push('<span class="act-pill p-add">Not Registered</span><span class="st-n">'+by['?']+'</span>');
  return out.length?('<span class="ac-strip-types">'+out.map(function(h){return '<span class="st-t">'+h+'</span>';}).join('')+'</span>'):'';
}
function flReceivedStrip(){

function flReceivedPopup(){
  var list=flRecentReceived();

    var late=(x.expected && x.actual && new Date(x.actual).getTime()>new Date(x.expected).getTime());
    return '<tr>'+
      '<td style="text-align:center">'+(x.ref?'<span class="code">'+esc(x.ref)+'</span>':'<span class="cl-dash">—</span>')+'</td>'+
      '<td class="proj-col">'+esc(x.name)+'<div class="cust">'+esc(x.customer||'')+'</div></td>'+
      '<td style="text-align:center">'+(x.type?'<span class="pill pill-ty '+typeKey(x.type)+'"><span class="pd"></span>'+esc(typeLabel(x.type))+'</span>':'<span class="cl-dash">—</span>')+'</td>'+
      '<td class="r">'+(x.value?fmtB2(x.value):'<span class="cl-dash">—</span>')+'</td>'+
      '<td class="num hz-nowrap" style="text-align:center">'+(x.expected?enDate(x.expected):'<span class="cl-dash">—</span>')+'</td>'+
      '<td class="num hz-nowrap" style="text-align:center'+(late?';color:var(--red-dk);font-weight:700':'')+'">'+enDate(x.actual)+'</td>'+
      '<td class="hz-nowrap" style="text-align:center">'+(x.cStart?('<span class="num">'+enDate(x.cStart)+'</span>'+(x.early?'<span class="hz-early">'+overdueInfo(x.early).txt+' before handover</span>':'')):'<span class="cl-dash">—</span>')+'</td>'+
      '<td class="num hz-nowrap" style="text-align:center">'+(x.cEnd?enDate(x.cEnd):'<span class="cl-dash">—</span>')+'</td>'+
      '<td class="num hz-nowrap" style="text-align:center">'+(x.period?esc(x.period):'<span class="cl-dash">—</span>')+'</td></tr>';

function renderBondTab(){
  var rows=DATA.projects.filter(function(p){
    return (F.statusTouched?matchStatus(p):true)&&matchYear(p)&&matchType(p)&&matchPM(p)&&matchCustomer(p)&&matchRef(p)&&(F.search?matchSearch(p):true);
  });

  var bonds=[]; rows.forEach(function(p){ projBonds(p).forEach(function(b){
    bonds.push({b:b,p:p,wa:isWarrantyProj(p),st:bondState(b.status,b.expiry),ty:bondTypeKey(b.bondType)});
  }); });
  var live=bonds.filter(function(x){ return x.st!=='Returned'; });   // returned bonds are done
  // the selected KPI card narrows EVERYTHING below it: charts, donut and table
  var view=(BOND_FILTER==='all')?live:live.filter(function(x){ return x.ty===BOND_FILTER; });
  function sumV(arr){ return arr.reduce(function(s,x){ return s+(Number(x.b.amount)||0); },0); }
  var TYPES=[
    {k:'perf',label:'Performance Bond',ic:'award',c:'#2D7FF0',bg:'#E8F1FE'},
    {k:'war', label:'Warranty Bond',   ic:'shield',c:'#E08600',bg:'#FFF4E2'},
    {k:'ret', label:'Retention',       ic:'wallet',c:'#7C5CF0',bg:'#EFECFE'},

  ];
  var cards=kxBondCard('all','All Bonds','file','#DC2828','#FEECEC',live.length,sumV(live))+
    TYPES.map(function(t){
      var g=live.filter(function(x){ return x.ty===t.k; });
      return kxBondCard(t.k,t.label,t.ic,t.c,t.bg,g.length,sumV(g));
    }).join('');
  // status split (value)
  // A bond that expired while the work is still running is On Hold, not Overdue —
  // it counts with Active because there is nothing to chase yet.
  function isClaimable(x){ return x.st==='Overdue' && contractEnded(x.p); }
  var vOvd=sumV(view.filter(isClaimable));
  var vAct=sumV(view.filter(function(x){ return !isClaimable(x); }));
  var vTot=vAct+vOvd;

  var ageB=[{l:'≤ 30 Days',lo:0,hi:30,c:'#7DC98F'},{l:'1–3 Months',lo:31,hi:90,c:'#F2C14E'},

  var ageData=ageB.map(function(z){

      return d>=z.lo&&d<=z.hi;
    });
    return {label:z.l,n:g.length,v:sumV(g),c:z.c};
  });
  // bond value by customer (top 6, split active/overdue)
  var byCust={};
  view.forEach(function(x){
    var k=x.p.customer||'—'; if(!byCust[k]) byCust[k]={a:0,o:0};

  var maxC=custs.length?custs[0].t:0;
  var custRows=custs.map(function(c){ return kxMoneyRow(c.k,c.a,c.o,maxC,'kx-act','kx-ovd','Active','Overdue',"custFilter('"+esc(String(c.k).replace(/'/g,"\\'"))+"')",F.customer===c.k); }).join('');
  var html='';
  html+='<div style="height:22px"></div>';
  html+='<div class="kx-cards">'+cards+'</div>';
  html+='<div style="height:14px"></div>';
  // story: how much is at risk -> which bonds sit where -> how long overdue -> who holds it
  html+='<div class="kx-charts">'+
    panel('shield','by Type','<div class="kx-rows">'+(typeRows||'<div class="empty">No bonds</div>')+'</div>'+

        '<div class="kx-dlegend"><span><i class="kx-dot kx-act"></i>Active<b>'+mbNum(vAct)+'<span class="kx-row-u"> MB</span></b></span>'+
        '<span><i class="kx-dot kx-ovd"></i>Overdue<b>'+mbNum(vOvd)+'<span class="kx-row-u"> MB</span></b></span></div>'+
      '</div>',kxLegend())+
    panel('building','by Customer','<div class="kx-rows kx-scroll">'+(custRows||'<div class="empty">No bonds</div>')+'</div>','<span class="kx-legend hdr-lg"><span><i class="kx-dot kx-act"></i>Active</span><span><i class="kx-dot kx-ovd"></i>Overdue</span></span>')+
    panel('alert','Overdue Aging','<div class="chart-box xs"><canvas id="bond-aging"></canvas></div>','')+
  '</div>';
  html+='<div style="height:18px"></div>';

  wireTable();
  drawDonut('bond-donut',[vAct,vOvd],['#0EA5A5','#D9488B'],['Active','Overdue'],true);
  drawAging('bond-aging',ageData);

// has the contract itself ended? a bond can only be reclaimed once it has

  return !!(p && p.end && new Date(p.end).getTime() < TODAY.getTime());

// classify a bond into one of the four fixed types
function bondTypeKey(t){
  var s=String(t||'').toLowerCase();
  if(s.indexOf('performance')>=0) return 'perf';
  if(s.indexOf('retention')>=0) return 'ret';
  if(s.indexOf('final')>=0||s.indexOf('installment')>=0) return 'fin';
  if(s.indexOf('warranty')>=0||s.indexOf('bank guarantee')>=0) return 'war';
  return 'other';
}

            {l:'1–2 Years',lo:366,hi:730,c:'#E2643F'},{l:'> 2 Years',lo:731,hi:1e9,c:'#B3272D'}];
// Icon + accent colour per closure subject. Vendor-side topics lean warm, customer-side
// topics lean cool, so the row reads as two families at a glance.
var CLOSURE_SUBJECT_STYLE={
  'Project Inventory':{ic:'box',c:'#7C3AED',bg:'#EFECFE'},
  'Purchase Orders':{ic:'cart',c:'#E08600',bg:'#FFF4E2'},
  'Vendor Payables':{ic:'receipt',c:'#DC2828',bg:'#FEECEC'},
  'Vendor Advances':{ic:'coins',c:'#DB2777',bg:'#FCE7F1'},
  'Vendor Retention':{ic:'wallet',c:'#EA580C',bg:'#FFEDD5'},
  'Billing':{ic:'doc',c:'#0891B2',bg:'#E0F5FA'},
  'Collections':{ic:'arrowIn',c:'#16A249',bg:'#E7F8ED'},
  'Customer Retention':{ic:'handshake',c:'#2563EB',bg:'#EEF3FE'},
  'Bank Guarantees':{ic:'bank',c:'#4F46E5',bg:'#EEF0FE'}
};
// Subject card — same visual grammar as the Overview KPI cards: icon-led title,
// big count, no proportion bar, always full-strength (no muted "clear" state).
function closureSubjectCard(name,wa,ma,subjKey){
  var tot=wa+ma;
  var sel=(CLOSE_FILTER==='sub:'+subjKey);
  var sk=String(subjKey).replace(/'/g,"\\'");
  var st=CLOSURE_SUBJECT_STYLE[subjKey]||{ic:'file',c:'#64748B',bg:'#EEF0F3'};
  return '<div class="cl-scard'+(sel?' on':'')+'" onclick="closeFilter(\'sub:'+sk+'\')" style="--kc:'+st.c+';--kcbg:'+st.bg+'" data-tip="'+esc(name)+'|'+tot+(tot===1?' project':' projects')+'">'+
    '<div class="cl-scard-h"><span class="cl-scard-ic">'+ICON[st.ic]+'</span><span class="cl-scard-name">'+esc(name)+'</span></div>'+
    '<div class="cl-scard-b"><span class="cl-scard-n num dsp">'+tot+'</span><span class="cl-scard-u">'+(tot===1?'Project':'Projects')+'</span></div></div>';
}
// Summary card — the still-open workload split into its two status buckets.
// No grand total (the split IS the story); sized to match the subject cards.
function closureSummaryCard(nEnded,nPending){
  return '<div class="cl-scard cl-scard-sum" style="--kc:#334155;--kcbg:#EEF1F5">'+
    '<div class="cl-scard-h"><span class="cl-scard-ic">'+ICON.list+'</span><span class="cl-scard-name">Outstanding Closures</span></div>'+
    '<div class="cl-sum-cols">'+
      '<button class="cl-sum-col'+(CLOSE_FILTER==='ended'?' on':'')+'" onclick="event.stopPropagation();closeFilter(\'ended\')" data-tip="Contract Ended in Process|'+nEnded+(nEnded===1?' project':' projects')+'">'+
        '<span class="cl-sum-n num">'+nEnded+'</span>'+
        '<span class="cl-sum-cap"><span class="cl-sum-dot" style="background:#DC2828"></span><span class="cl-sum-cap-t">Closure in Process</span></span></button>'+
      '<button class="cl-sum-col'+(CLOSE_FILTER==='pending'?' on':'')+'" onclick="event.stopPropagation();closeFilter(\'pending\')" data-tip="Pending Closure|'+nPending+(nPending===1?' project':' projects')+'">'+
        '<span class="cl-sum-n num">'+nPending+'</span>'+
        '<span class="cl-sum-cap"><span class="cl-sum-dot" style="background:#E08600"></span><span class="cl-sum-cap-t">Pending Closure</span></span></button>'+
    '</div></div>';
}
function renderClosureTab(){
  var rows=DATA.projects.filter(function(p){
    return (F.statusTouched?matchStatus(p):true)&&matchYear(p)&&matchType(p)&&matchPM(p)&&matchCustomer(p)&&matchRef(p)&&(F.search?matchSearch(p):true);
  });
  var inClosure=rows.filter(function(p){ return closureOpenItems(p).length>0; });
  // the selected KPI / bar narrows every panel below it
  var view=inClosure.filter(function(p){
    if(CLOSE_FILTER==='all') return true;
    if(CLOSE_FILTER==='ended') return statusLabel(p).txt==='Contract Ended in Process';
    if(CLOSE_FILTER==='pending') return statusLabel(p).txt!=='Contract Ended in Process';
    if(CLOSE_FILTER==='wa') return isWarrantyProj(p);
    if(CLOSE_FILTER==='ma') return !isWarrantyProj(p);
    if(CLOSE_FILTER.indexOf('sub:')===0){
      var want=CLOSE_FILTER.slice(4);
      return closureOpenItems(p).some(function(c){ return (closureSubjectLabel(c.subject)||c.subject)===want; });
    }
    if(CLOSE_FILTER.indexOf('age:')===0){
      var lbl=CLOSE_FILTER.slice(4);
      if(!p.end) return false;
      var dd=Math.round((TODAY.getTime()-new Date(p.end).getTime())/86400000);
      var zn=CLOSURE_AGE_BUCKETS.filter(function(z){return z.l===lbl;})[0];
      return zn?(dd>=zn.lo&&dd<=zn.hi):true;
    }
    return true;
  });
  function projAmt(p){ return closureOpenItems(p).reduce(function(s,c){ return s+(Number(c.amount)||0); },0); }
  var endedList=view.filter(function(p){ return statusLabel(p).txt==='Contract Ended in Process'; });
  var pendList=view.filter(function(p){ return statusLabel(p).txt!=='Contract Ended in Process'; });
  var nEnded=endedList.length, nPending=pendList.length;
  var vEnded=endedList.reduce(function(s,p){ return s+projAmt(p); },0);
  var vPending=pendList.reduce(function(s,p){ return s+projAmt(p); },0);
  var nWA=view.filter(isWarrantyProj).length, nMA=view.length-nWA;
  // money split by side, per subject
  var bySub={};
  view.forEach(function(p){
    closureOpenItems(p).forEach(function(c){
      var k=closureSubjectLabel(c.subject)||c.subject||'Other';
      if(!bySub[k]) bySub[k]={amt:0,n:0,side:closureSide(c.subject)};
      bySub[k].amt+=(Number(c.amount)||0); bySub[k].n++;
    });
  });
  function sideRows(side){
    var list=Object.keys(bySub).filter(function(k){ return bySub[k].side===side; })
      .map(function(k){ return {k:k,amt:bySub[k].amt,n:bySub[k].n}; })
      .sort(function(a,b){ return b.amt-a.amt; });
    var max=list.length?list[0].amt:0;
    var tot=list.reduce(function(s,x){ return s+x.amt; },0);
    var body=list.map(function(x){
      var scale=max?Math.max(Math.round(x.amt/max*100),6):6;
      var sel=(CLOSE_FILTER==='sub:'+x.k);
      return '<div class="kx-row kx-clickable'+(sel?' on':'')+'" onclick="closureSubjPopup(\''+esc(x.k).replace(/'/g,"\\'")+'\')" data-tip="'+esc(x.k)+'|'+mbNum(x.amt)+' MB · '+x.n+(x.n===1?' item':' items')+'">'+
        '<span class="kx-row-n" title="'+esc(x.k)+'">'+esc(x.k)+'</span>'+
        '<span class="kx-bar"><span class="kx-seg '+(side==='in'?'kx-ar':'kx-ap')+'" style="width:'+scale+'%"></span></span>'+
        '<span class="kx-row-v num">'+mbNum(x.amt)+'<span class="kx-row-u"> MB</span></span></div>';
    }).join('');
    return {html:body,total:tot,count:list.reduce(function(s,x){return s+x.n;},0)};
  }
  var ar=sideRows('in'), ap=sideRows('out');
  function totalFoot(label,v,cls){
    var ic=(cls==='t-ar')?ICON.arrowIn:ICON.arrowOut;
    return '<div class="kx-total '+cls+'"><span class="kx-total-ic">'+ic+'</span>'+
      '<span class="kx-total-l">'+label+'</span>'+
      '<span class="kx-total-v num">'+mbNum(v)+' MB</span></div>';
  }
  // How long has each blocked project been dragging? Measured from CONTRACT END —
  // "As of Date" only records when the row was last touched, so it cannot age anything.
  var ageB=CLOSURE_AGE_BUCKETS;
  var todayMs=TODAY.getTime();
  // Aging buckets reflect the current view but IGNORE an active age selection,
  // so all four bars stay visible and you can click between them.
  var ageBase=(CLOSE_FILTER.indexOf('age:')===0)
    ? inClosure.filter(function(p){ return true; })
    : view;
  var ageData=ageB.map(function(z){
    var g=ageBase.filter(function(p){
      if(!p.end) return false;
      var d=Math.round((todayMs-new Date(p.end).getTime())/86400000);
      return d>=z.lo && d<=z.hi;
    });
    return {label:z.l,n:g.length,c:z.c};
  });
  // Which subject blocks the most PROJECTS (a project can be blocked by several)
  var blockBy={};
  view.forEach(function(p){
    var wa=isWarrantyProj(p), seen={};
    closureOpenItems(p).forEach(function(c){
      var k=closureSubjectLabel(c.subject)||c.subject||'Other';
      if(seen[k]) return; seen[k]=1;                       // count each project once per subject
      if(!blockBy[k]) blockBy[k]={wa:0,ma:0};
      blockBy[k][wa?'wa':'ma']++;
    });
  });
  // show every one of the nine subjects, so a clean topic is visibly clean
  var blocks=CLOSURE_SUBJECTS.map(function(sj){
    var k=closureSubjectLabel(sj.key)||sj.key;
    var v=blockBy[k]||{wa:0,ma:0};
    return {k:k,wa:v.wa,ma:v.ma,t:v.wa+v.ma};
  }).sort(function(a,b){ return b.t-a.t; });
  var maxB=blocks.reduce(function(m,x){ return Math.max(m,x.t); },0);
  var blockRows=blocks.map(function(x){
    var sel=(CLOSE_FILTER==='sub:'+x.k);
    return kxCountRow(x.k,x.wa,x.ma,maxB,x.t?("closureSubjPopup('"+esc(x.k).replace(/'/g,"\\'")+"')"):'',sel,x.k);
  }).join('');
  var html='';
  html+='<div style="height:22px"></div>';
  // Row of 10 cards: 1 summary + 9 subject topics, in the SAME order and with the SAME
  // names as the detail-table columns below (CLOSURE_SUBJECTS), so the two line up 1:1.
  var subjectCards=CLOSURE_SUBJECTS.map(function(sj){
    var k=closureSubjectLabel(sj.key)||sj.key;
    var v=blockBy[k]||{wa:0,ma:0};
    var baseName=String(sj.label||k).replace(/<br\s*\/?>/gi,' ');
    return closureSubjectCard('O/S '+baseName,v.wa,v.ma,k);
  }).join('');
  html+='<div class="cl-scards">'+closureSummaryCard(nEnded,nPending)+subjectCards+'</div>';
  html+='<div style="height:16px"></div>';
  // Analysis row: type-split pie + aging + receivables + payables, all in one line.
  html+='<div class="cl-analysis">'+
    panel('wallet','Outstanding Receivables','<div class="kx-rows kx-rows-sc">'+(ar.html||'<div class="empty">Nothing to collect</div>')+'</div>'+
      totalFoot('To Receive',ar.total,'t-ar'),'')+
    panel('cart','Outstanding Payables','<div class="kx-rows kx-rows-sc">'+(ap.html||'<div class="empty">Nothing to settle</div>')+'</div>'+
      totalFoot('To Pay',ap.total,'t-ap'),'')+
    panel('chart','Project Count by Type','<div class="chart-box cl-pie-box"><canvas id="closure-pie"></canvas></div><div class="cl-pie-legend" id="cl-pie-legend"></div>','')+
  '</div>';
  html+='<div style="height:18px"></div>';
  html+=closureTablePanel(view.length?view:[]);
  document.getElementById('app').innerHTML=html;
  // Closure matrix: header click sorts (re-render closure tab), row click opens details.
  document.querySelectorAll('.cl-table th[data-ccol]').forEach(function(th){
    th.addEventListener('click',function(){
      var c=th.getAttribute('data-ccol');
      if(CSORT.col===c) CSORT.dir*=-1; else { CSORT.col=c; CSORT.dir=1; }
      renderClosureTab();
    });
  });
  document.querySelectorAll('.cl-table tr.row[data-item]').forEach(function(tr){
    tr.addEventListener('click',function(){ openModal(Number(tr.getAttribute('data-item'))); });
  });
  // Pie: proportion of still-open projects by type
  var pieWA=nWA, pieMA=nMA;
  drawPie('closure-pie',[pieWA,pieMA],['#2D7FF0','#E03E3E'],['Warranty','Maintenance'],['wa','ma'],{thin:true});
  var legEl=document.getElementById('cl-pie-legend');
  if(legEl){
    legEl.innerHTML=
      '<span class="cl-pl"><i style="background:#2D7FF0"></i>Warranty</span>'+
      '<span class="cl-pl"><i style="background:#E03E3E"></i>Maintenance</span>';
  }
}
// Clicking a subject anywhere on the Closure tab opens the detail behind it:
// every outstanding row of that subject, grouped by project.
// Detail popup for a closure subject. typeFilter ('wa'|'ma'|'') narrows to a
// single project type so clicking the red (MA) or blue (WA) part of a bar shows
// only that side. Columns are sortable via CLSORT (sort applies within each project).
var CLSORT={col:'',dir:1};
function closureSubjPopup(subject,typeFilter){
  var subj=String(subject||'');
  var tf=typeFilter||'';
  var list=[];
  DATA.projects.forEach(function(p){
    if(!(matchYear(p)&&matchType(p)&&matchPM(p)&&matchCustomer(p)&&matchRef(p)&&(F.search?matchSearch(p):true))) return;
    if(tf==='wa' && !isWarrantyProj(p)) return;
    if(tf==='ma' && isWarrantyProj(p)) return;
    var rows=closureOpenItems(p).filter(function(c){ return (closureSubjectLabel(c.subject)||c.subject)===subj; });
    if(rows.length) list.push({p:p,rows:rows});
  });
  // 'in' subjects are customer-facing (billing, collections, customer retention, BG);
  // 'out' subjects are vendor-facing (POs, vendor payables/retention/advances, stock).
  var isCustomerCol=(closureSide(subj)==='in');
  var partyLabel=isCustomerCol?'Customer':'Vendor';
  // sortable columns: key -> value getter (per closure row, with project context)
  var clGet={
    doc:function(c,p){return c.documents||'';},
    party:function(c,p){return c.vendor||(isCustomerCol?(p.customer||''):'');},
    detail:function(c,p){return c.details||c.note||'';},
    amt:function(c,p){return Number(c.amount)||0;},
    asof:function(c,p){return c.asOf||'';}
  };
  function sortRows(rows,p){
    if(!CLSORT.col||!clGet[CLSORT.col]) return rows;
    var g=clGet[CLSORT.col], d=CLSORT.dir;
    return rows.slice().sort(function(a,b){ var xa=g(a,p),xb=g(b,p);
      if(typeof xa==='number'&&typeof xb==='number') return (xa-xb)*d;
      return String(xa).localeCompare(String(xb))*d; });
  }
  function sortArrow(col){ return CLSORT.col===col?(CLSORT.dir>0?' ▲':' ▼'):''; }
  function th(col,cls,label,sortable){
    return sortable
      ? '<th class="'+cls+' clh-sortable" data-clcol="'+col+'">'+label+'<span class="ar">'+sortArrow(col)+'</span></th>'
      : '<th class="'+cls+'">'+label+'</th>';
  }
  var head='<tr>'+
    th('doc','clh-doc-th','Documents',true)+
    th('party','clh-vendor-th',partyLabel,true)+
    th('detail','clh-detail-th','Description',false)+
    th('amt','clh-amt-th','Outstanding (Baht)',true)+
    th('asof','clh-asof-th','As of',true)+
  '</tr>';
  var body=list.map(function(g){
    var p=g.p;
    var sub=g.rows.reduce(function(s,c){ return s+(Number(c.amount)||0); },0);
    var lines=sortRows(g.rows,p).map(function(c){
      // Customer-facing subject with no explicit party on the row -> fall back to the
      // project's customer, so a "Customer" column is never left blank.
      var party=c.vendor||(isCustomerCol?p.customer:'');
      return '<tr>'+
        '<td class="clh-doc">'+(c.documents?esc(c.documents):'<span class="cl-dash">–</span>')+'</td>'+
        '<td class="clh-vendor">'+(party?esc(party):'<span class="cl-dash">–</span>')+'</td>'+
        '<td class="clh-detail">'+(c.details?esc(c.details):(c.note?esc(c.note):'<span class="cl-dash">–</span>'))+'</td>'+
        '<td class="clh-amt num">'+(c.amount?fmtB2(c.amount):'<span class="cl-dash">–</span>')+'</td>'+
        '<td class="clh-asof num">'+(c.asOf?enDate(c.asOf):'<span class="cl-dash">–</span>')+'</td></tr>';
    }).join('');
    return '<div class="cl-group">'+
      '<div class="cl-grp-h"><span class="code">'+esc(p.ref||'—')+'</span>'+
        '<span class="pill pill-ty '+typeKey(p.type)+'"><span class="pd"></span>'+esc(typeLabel(p.type))+'</span>'+
        '<span class="cl-grp-name">'+esc(p.name||'')+'</span>'+
        (sub?'<span class="cl-grp-total num">'+fmtB2(sub)+' Baht</span>':'')+'</div>'+
      '<div class="clh-wrap"><table class="clh-table"><thead>'+head+'</thead><tbody>'+lines+'</tbody></table></div></div>';
  }).join('');
  var typeTag=tf==='wa'?' · Warranty':(tf==='ma'?' · Maintenance':'');
  var mo=document.getElementById('modal');
  mo.innerHTML='<div class="mh"><div class="mic">'+ICON.alert+'</div><div class="mt">'+
    '<div class="ttl">'+esc(subj)+esc(typeTag)+'</div>'+
    '</div><button class="mx" onclick="closeModal()">✕</button></div>'+
    '<div class="mb" style="display:block">'+(body||'<div class="empty">Nothing outstanding</div>')+'</div>';
  mo.classList.remove('wide-modal','wide-bond','wide'); mo.classList.add('wide-closure');
  document.getElementById('ov').classList.add('show');
  // wire up sortable headers — re-open the same popup with the new sort applied
  mo.querySelectorAll('.clh-sortable').forEach(function(h){
    h.addEventListener('click',function(){
      var c=h.getAttribute('data-clcol');
      if(CLSORT.col===c) CLSORT.dir*=-1; else { CLSORT.col=c; CLSORT.dir=1; }
      closureSubjPopup(subj,tf);
    });
  });
}
// A scale under the ranked bars so the lengths can be read as numbers.
function kxScale(max){
  if(!max) return '';
  var step=Math.max(1,Math.ceil(max/4));
  var ticks=[]; for(var v=0; v<=max; v+=step) ticks.push(v);
  if(ticks[ticks.length-1]!==max) ticks.push(max);
  var marks=ticks.map(function(v){
    return '<span class="kx-tick" style="left:'+(max?(v/max*100):0)+'%">'+v+'</span>';
  }).join('');
  return '<div class="kx-scale"><span class="kx-scale-pad"></span><span class="kx-scale-track">'+marks+'</span><span class="kx-scale-tail"></span></div>';
}
// A ranked row that counts PROJECTS (not money) — same shape as kxMoneyRow.
// subjKey (when provided) lets each coloured segment open a type-filtered popup.
function kxCountRow(name,a,b,maxTotal,onclick,selected,subjKey){
  var tot=a+b;
  // a subject with nothing outstanding still gets a row — an empty track reads as "clear"
  if(!tot){
    return '<div class="kx-row kx-row-0" data-tip="'+esc(name)+'|Nothing outstanding — this check is clear">'+
      '<span class="kx-row-n" title="'+esc(name)+'">'+esc(name)+'</span>'+
      '<span class="kx-clear">All clear</span>'+
      '<span class="kx-row-v num">0 <span class="kx-row-u">Projects</span></span></div>';
  }
  var minPct=(a&&b)?26:14;
  var scale=maxTotal?Math.max(Math.round(tot/maxTotal*100),minPct):minPct;
  var aw=Math.round(a/tot*100), bw=100-aw;
  var floor=(a&&b)?34:0;
  if(floor){ if(aw<floor){ aw=floor; bw=100-floor; } else if(bw<floor){ bw=floor; aw=100-floor; } }
  var both=(a&&b);
  var sk=subjKey?String(subjKey).replace(/'/g,"\\'"):'';
  function seg(v,w,cls,lab,type){
    if(!v) return '';
    // Clicking a coloured segment drills into just that project type (WA or MA).
    var clk=sk?(' onclick="event.stopPropagation();closureSubjPopup(\''+sk+'\',\''+type+'\')" style="width:'+w+'%;cursor:pointer"'):(' style="width:'+w+'%"');
    return '<span class="kx-seg '+cls+'"'+clk+' data-tip="'+lab+'|'+v+(v===1?' project':' projects')+'">'+(both?v:'')+'</span>';
  }
  return '<div class="kx-row'+(onclick?' kx-clickable':'')+(selected?' on':'')+'"'+(onclick?' onclick="'+onclick+'"':'')+
    ' data-tip="'+esc(name)+'|'+tot+(tot===1?' project':' projects')+'">'+
    '<span class="kx-row-n" title="'+esc(name)+'">'+esc(name)+'</span>'+
    '<span class="kx-bar" style="flex-basis:'+scale+'%">'+seg(a,aw,'kx-wa','Warranty','wa')+seg(b,bw,'kx-ma','Maintenance','ma')+'</span>'+
    '<span class="kx-row-v num">'+tot+' <span class="kx-row-u">'+(tot===1?'Project':'Projects')+'</span></span></div>';
}
// Aging bars that count projects — clickable to filter the whole tab by age band.
function drawAgingCount(id,data){
  var el=document.getElementById(id); if(!el||typeof Chart==='undefined') return;
  if(window['_ac_'+id]){ try{window['_ac_'+id].destroy();}catch(e){} }
  var selLabel=(CLOSE_FILTER.indexOf('age:')===0)?CLOSE_FILTER.slice(4):null;
  function hexA(hex,a){ var n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
  var bg=data.map(function(d){ return (selLabel&&d.label!==selLabel)?hexA(d.c,0.28):d.c; });
  var topLabels={id:'agingCountLabels',afterDatasetsDraw:function(chart){
    var ctx=chart.ctx, meta=chart.getDatasetMeta(0);
    meta.data.forEach(function(bar,i){
      var d=data[i]; if(!d||!d.n) return;
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillStyle=(selLabel&&d.label!==selLabel)?'#B4BAC4':'#3C434F'; ctx.font='800 10px Inter';
      ctx.fillText(d.n,bar.x,bar.y-4); ctx.restore();
    });
  }};
  window['_ac_'+id]=new Chart(el,{type:'bar',plugins:[topLabels],
    data:{labels:data.map(function(d){return d.label;}),
      datasets:[{data:data.map(function(d){return d.n;}),
        backgroundColor:bg,borderRadius:5,barThickness:30}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:16}},
      onHover:function(e,els){ e.native.target.style.cursor=els.length?'pointer':'default'; },
      onClick:function(e,els){ if(!els.length) return; var lbl=data[els[0].index].label;
        CLOSE_FILTER=(CLOSE_FILTER==='age:'+lbl)?'all':('age:'+lbl); renderClosureTab(); renderTabs(); },
      plugins:{legend:{display:false},tooltip:{intersect:false,mode:'index',callbacks:{label:function(c){
        var d=data[c.dataIndex];
        return d.n?(d.n+(d.n===1?' project':' projects')):'No projects'; }}}},
      scales:{x:{grid:{display:false},ticks:{font:function(ctx){ var lb=data[ctx.index]; return {family:'Inter',size:10,weight:(selLabel&&lb&&lb.label===selLabel)?'800':'400'};},

// (no text is redrawn, so labels never overlap — the tick keeps its red color via the ticks.color callback).
function boldTickPlugin(getSelIndex,labelFor){
  return {id:'selCapsule',afterDraw:function(chart){
    var idx=getSelIndex(); if(idx<0||idx==null) return;
    var xs=chart.scales.x; if(!xs) return;
    var x=xs.getPixelForTick(idx); if(x==null) return;
    var ctx=chart.ctx;
    var fs=(xs.options.ticks&&xs.options.ticks.font&&xs.options.ticks.font.size)||12;
    // Chart draws x tick labels below the axis: baseline ≈ xs.top + tickLength + padding + ascent.
    var tickLen=(xs.options.ticks&&xs.options.ticks.padding!=null)?xs.options.ticks.padding:3;
    var majorPad=(xs.options.ticks&&xs.options.ticks.padding)||0;
    // vertical centre of the label text row
    var labelTop=xs.top + (xs.options.grid&&xs.options.grid.tickLength!=null?xs.options.grid.tickLength:8) + majorPad;
    var cy=labelTop + fs/2;
    ctx.save();
    ctx.font=fs+'px Inter';
    var label=String(labelFor(idx));
    var tw=ctx.measureText(label).width;
    var w=tw+14, h=fs+7, r=h/2;
    var l=x-w/2, t=cy-h/2;

// Recompute the monthly events for the chart year from the currently filtered projects.
// Respects In Charge / Customer / Ref / Type / Status (not the Year filter — the chart is a fixed year).
function computeMonthlyEvents(){
  // Default year = the server's current year; when the user picks a Year filter, follow it.
  var narrowed=F.pm||F.customer||F.ref||F.search;
  var yr;
  if(EVYEAR){ yr=EVYEAR; }        // year chosen with the panel ‹ › nav wins
  else if(F.year){ yr=parseInt(F.year,10); }
  else if(narrowed){
    // No explicit year but a specific filter is on: focus the year with the most events
    // in the filtered set, so the chart reflects the same projects shown in the table.
    // NOTE: Events deliberately ignores the KPI type filter (matchType) — selecting a KPI card
    // (e.g. Investment) should not empty the Events chart; it reacts only to the top filter bar.
    var sub=DATA.projects.filter(function(p){ return matchPM(p)&&matchCustomer(p)&&matchRef(p)&&(F.search?matchSearch(p):true); });
    var yc={};
    sub.forEach(function(p){
      [p.start,p.end,p.closed].forEach(function(d){ if(d){ var y=+String(d).substring(0,4); if(y){ yc[y]=(yc[y]||0)+1; } } });
    });
    var best=DATA.monthlyEvents.year, bestN=-1;
    Object.keys(yc).forEach(function(y){ if(yc[y]>bestN){ bestN=yc[y]; best=+y; } });
    yr=best;
  } else { yr=DATA.monthlyEvents.year; }
  var isCurrentYear=(yr===DATA.monthlyEvents.year);
  var anyNonYear=F.pm||F.customer||F.ref||(F.status&&F.status!=='Active')||F.search;
  var hasFrontlogData=(DATA.frontlog||[]).some(function(f){ return f.eventDate && new Date(f.eventDate).getFullYear()===yr; });
  // Fast path: current year, no other filter, and no frontlog data -> authoritative server figures
  if(isCurrentYear && !anyNonYear && !hasFrontlogData && (F.status===''||F.status==='Active')){

function ganttPanel(rows){
  rows=rows.filter(function(p){ return GANTT_TYPES[typeKey(p.type)]!==false; });
  if(!rows.length) return panel('gantt','Project Timeline','<div class="empty">No projects match the current filters</div>','');

  var mn=Math.min.apply(null,rows.map(function(p){return new Date(p.start).getTime();}));
  var mx=Math.max.apply(null,rows.map(function(p){return new Date(p.end).getTime();}));
  var tnow=TODAY.getTime();
  // Only pull "today" into view when it's within ~1 year of the project range.
  // For old years (all projects long finished) keep the timeline focused on the projects themselves.
  var oneYr=365*86400000;
  if(tnow>=mn-oneYr && tnow<=mx+oneYr){ mn=Math.min(mn,tnow); mx=Math.max(mx,tnow); }
  var pad=(mx-mn)*0.14; mn-=pad*0.3; mx+=pad; var span=mx-mn;
  function pct(t){return (t-mn)/span*100;}
  var nowInRange=tnow>=mn&&tnow<=mx;
  var spanYears=(mx-mn)/(365.25*86400000);
  var byMonth=spanYears<=4;
  var y0=new Date(mn).getFullYear(),y1=new Date(mx).getFullYear();
  var head='<div class="tl-head"><div class="tl-label" style="width:230px"></div><div class="tl-track" style="position:relative;height:14px">'; var grids='';
  if(byMonth){
    var d=new Date(y0,0,1);
    while(d.getTime()<=mx){ var t=d.getTime(); if(t>=mn){ var x=pct(t); head+='<span style="position:absolute;left:'+x+'%;transform:translateX(-50%);font-size:9px">'+MON[d.getMonth()]+' '+String(d.getFullYear()).substring(2)+'</span>'; grids+='<div class="tl-grid" style="left:'+x+'%"></div>'; } d.setMonth(d.getMonth()+ (spanYears<=2?2:3)); }
  } else {
    for(var y=y0;y<=y1;y++){ var tt=new Date(y,0,1).getTime(); if(tt<mn||tt>mx)continue; var xx=pct(tt); head+='<span style="position:absolute;left:'+xx+'%;transform:translateX(-50%)">'+y+'</span>'; grids+='<div class="tl-grid" style="left:'+xx+'%"></div>'; }
  }
  head+=(nowInRange?'<div class="tl-now lbl" style="left:'+pct(tnow)+'%"></div>':'')+'</div></div>';
  var body='';
  rows.forEach(function(p){
    var s=new Date(p.start).getTime(),e=new Date(p.end).getTime();
    var L=pct(s),fullW=Math.max(pct(e)-pct(s),0.6);
    var prog=Math.max(0,Math.min(100,(tnow-s)/(e-s)*100));

      '<div class="tl-date" style="left:'+L+'%;transform:translateX(-100%);padding-right:5px">'+enDateShort(p.start)+'</div>'+
      '<div class="tl-full '+k+'" style="left:'+L+'%;width:'+fullW+'%"></div>'+
      '<div class="tl-bar '+k+'" style="left:'+L+'%;width:'+progW+'%"></div>'+
      '<div class="tl-pct" style="left:calc('+(L+progW)+'% + 4px);color:'+typeColor(p.type)+'">'+Math.round(prog)+'%</div>'+
      '<div class="tl-date" style="left:'+(L+fullW)+'%;padding-left:5px">'+enDateShort(p.end)+'</div>'+
      (nowInRange?'<div class="tl-now" style="left:'+pct(tnow)+'%"></div>':'')+'</div></div>';
  });
  return panel('gantt','Project Timeline','<div class="tl-scroll"><div style="min-width:880px">'+head+'<div class="tl-rows">'+body+'</div></div></div>','Projects: '+rows.length);
}

function contractNoHtml(cn){
  cn=String(cn||'').trim(); if(!cn) return '';
  // split on explicit newlines first
  var parts=cn.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
  // if single line but looks like 2+ dash-coded contract numbers separated by space (e.g. AMR-ITS-2023-001 AMR-ITS-2023-002)
  if(parts.length===1){
    var m=parts[0].match(/[A-Za-z]+(?:-[A-Za-z0-9]+){2,}/g);
    if(m && m.length>=2 && m.join(' ')===parts[0]) parts=m;
  }
  return parts.map(function(x){return esc(x);}).join('<br>');
}

// Normalize a project name to compare "same work" across renewals
function normName(s){
  s=String(s||'');
  s=s.replace(/^(งานจ้าง|สัญญาจ้างบริการ|สัญญาจ้าง|สัญญา|จ้าง|โครงการ|ค่า)/,'');
  s=s.replace(/\(.*?\)/g,'');
  s=s.replace(/(ปีที่|เฟส|phase|year|ครั้งที่|ระยะที่)\s*\d+[-\d]*/gi,'');
  s=s.replace(/(พ\.ศ\.|ปีงบประมาณ)\s*\d+/g,'');
  s=s.replace(/\d{4}/g,'');
  s=s.replace(/ซ่อมแชม/g,'ซ่อมแซม').replace(/แซ่ม/g,'แซม').replace(/Camara/gi,'Camera').replace(/Cannera/gi,'Camera');
  s=s.replace(/[\s\-_.,#/]+/g,'');
  return s.toLowerCase();
}
function nameSim(a,b){
  if(!a||!b) return 0;
  var A={},B={},na=0,nb=0,inter=0;
  for(var i=0;i<a.length-1;i++){ var g=a.substr(i,2); if(!A[g]){A[g]=1;na++;} }
  for(var j=0;j<b.length-1;j++){ var h=b.substr(j,2); if(!B[h]){B[h]=1;nb++;} }
  for(var k in A){ if(B[k]) inter++; }
  var uni=na+nb-inter; return uni? inter/uni : 0;
}
// Find a successor MA contract (same customer, similar name, starts around/after this one ends)
function continuationOf(p){
  if(typeKey(p.type)!=='ma'||!p.end) return null;
  var pe=new Date(p.end).getTime(); var pn=normName(p.name);
  var oneYrBefore=new Date(p.end); oneYrBefore.setFullYear(oneYrBefore.getFullYear()-1); var lo=oneYrBefore.getTime();
  var best=null,bs=0;
  DATA.projects.forEach(function(q){
    if(q===p||typeKey(q.type)!=='ma'||q.customer!==p.customer||!q.start) return;
    var qs=new Date(q.start).getTime();
    if(qs<lo) return;
    if(qs<=pe && q.end && new Date(q.end).getTime()<=pe) return; // q fully before p ends — not a successor
    var s=nameSim(pn,normName(q.name));
    if(s>bs){ bs=s; best=q; }
  });
  if(bs>=0.6) return best;
  // Consolidation case: same customer gets a NEW MA contract starting within ~15 months after this ends,
  // while several of the customer's MA contracts ended around the same time (many-to-one merge).
  var win=new Date(p.end); win.setMonth(win.getMonth()+15); var winEnd=win.getTime();
  var endedSame=DATA.projects.filter(function(q){ if(typeKey(q.type)!=='ma'||q.customer!==p.customer||!q.end) return false; var e=new Date(q.end).getTime(); return Math.abs(e-pe)<=95*86400000; }).length; // ended within ~3 months of p
  var newAfter=DATA.projects.filter(function(q){ if(typeKey(q.type)!=='ma'||q.customer!==p.customer||!q.start) return false; var s=new Date(q.start).getTime(); return s>pe && s<=winEnd; });
  if(endedSame>=2 && newAfter.length>=1 && newAfter.length<endedSame){
    // pick the earliest new contract as the consolidated successor
    newAfter.sort(function(a,b){return new Date(a.start)-new Date(b.start);});
    return newAfter[0];
  }
  return null;
}
var GAP_OK_MONTHS=4; // a successor starting within this many months = seamless continuation (not a loss)
function computeLost(year){
  var prevEndStart=new Date(year-1,0,1).getTime(), prevEndEnd=new Date(year-1,11,31).getTime();
  var endedPrev=DATA.projects.filter(function(p){ if(typeKey(p.type)!=='ma'||!p.end) return false; var e=new Date(p.end).getTime(); return e>=prevEndStart&&e<=prevEndEnd; });
  var lost=[];
  endedPrev.forEach(function(p){
    var nxt=continuationOf(p);
    var gapMo=null;
    if(nxt){ gapMo=Math.round((new Date(nxt.start)-new Date(p.end))/(30.44*86400000)); if(gapMo<0) gapMo=0; }
    // lost if no continuation, OR continuation resumes only after a real gap
    if(!nxt || gapMo>GAP_OK_MONTHS){ lost.push({p:p, resumed:nxt, gapMo:(nxt?gapMo:null)}); }
  });
  return lost; // array of {p, resumed, gapMo}
}

// Find a PREDECESSOR MA contract (same customer, similar name, ended before/around this one starts)
function predecessorOf(p){
  if(typeKey(p.type)!=='ma'||!p.start) return null;
  var ps=new Date(p.start).getTime(); var pn=normName(p.name);
  var lo=new Date(p.start); lo.setMonth(lo.getMonth()-15); var loT=lo.getTime();
  var best=null,bs=0;
  DATA.projects.forEach(function(q){
    if(q===p||typeKey(q.type)!=='ma'||q.customer!==p.customer||!q.end) return;
    var qe=new Date(q.end).getTime();
    if(qe> ps+95*86400000) return; // ends well after p starts -> not a predecessor
    if(qe< loT) return;            // ended too long ago
    var s=nameSim(pn,normName(q.name));
    if(s>bs){ bs=s; best=q; }
  });
  return bs>=0.6?best:null;
}

function computeNew(year){
  var ys=new Date(year,0,1).getTime(), ye=new Date(year,11,31).getTime();
  var started=DATA.projects.filter(function(p){ return typeKey(p.type)==='ma'&&p.start&&new Date(p.start).getTime()>=ys&&new Date(p.start).getTime()<=ye; });

}

// Status pill for the project modal's Bond/Retention block.
// If the BG is past its due date and not yet Returned, always show "Overdue" (never the raw "Expired").
function bgStatusPill(p){
  if(!p.bgStatus && !p.bgExpiry) return '<span class="bgna">N/A</span>';
  return bondStatePill(p.bgStatus, p.bgExpiry);
}
// Canonical bond state — always Active / Overdue / Returned (never the raw sheet word e.g. "Expired").
// Returned is set manually in the Bond Data sheet's Status column. Anything not Returned is judged
// by its Due date: past due -> Overdue, otherwise -> Active.
function bondState(status, expiry){
  if(status==='Returned') return 'Returned';
  if(expiry && new Date(expiry).getTime() < TODAY.getTime()) return 'Overdue';
  return 'Active';
}
function bondStatePill(status, expiry){
  var s=bondState(status, expiry);
  if(s==='Returned') return '<span class="pill closed"><span class="pd"></span>Returned</span>';
  if(s==='Overdue')  return '<span class="pill" style="background:var(--red-soft);color:var(--red-dk)"><span class="pd" style="background:var(--red)"></span>Overdue</span>';
  return '<span class="pill active"><span class="pd"></span>Active</span>';
}

        '<div><span class="bgl">Bank Guarantee No.</span><span class="bgv num">'+(b.bondNo?esc(b.bondNo):'<span class="bgna">N/A</span>')+'</span></div>'+
        '<div><span class="bgl">Bank</span><span class="bgv">'+(b.bank?esc(b.bank):'<span class="bgna">N/A</span>')+'</span></div>'+
        '<div><span class="bgl">Amount (Baht)</span><span class="bgv num">'+(b.amount?fmtB2(b.amount):'<span class="bgna">N/A</span>')+'</span></div>'+
      '</div>'+
    '</div>';
  }).join('');
  var countLabel=bs.length>1?'<span class="bond-count">'+bs.length+' bonds</span>':'';
  return '<div class="bond-block"><div class="bond-head"><span class="bond-title"><span class="bond-ic">'+ICON.shield+'</span>Bond / Retention</span>'+countLabel+'</div>'+rows+'</div>';
}
// One landscape table per subject of outstanding closure issues.
// Single source of truth: the Closure Tracking sheet ONLY. Bonds are never folded in here
// (they have their own display in the Bond / Retention block), so no duplicate rows.
// Description is intentionally blank for Bank Guarantees / Customer Retention subjects.
function closureBlockHtml(p){
  var open=closureOpenItems(p).slice();
  // subjects that concern the customer side -> second column shows the Customer, not a Vendor
  var CUSTOMER_SUBJECTS=['Billing','Collections','Collection','Customer Retention','Bank Guarantees','Bank Guarantee'];
  function isBG(subj){ return subj==='Bank Guarantees'||subj==='Bank Guarantee'; }
  if(!open.length) return '';
  var order=CLOSURE_SUBJECTS.map(function(s){return s.key;});
  var groups={};
  open.forEach(function(c){ (groups[c.subject]=groups[c.subject]||[]).push(c); });
  var keys=Object.keys(groups).sort(function(a,b){ var ia=order.indexOf(a),ib=order.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  var body=keys.map(function(subj){
    var items=groups[subj];
    var custSide=CUSTOMER_SUBJECTS.indexOf(subj)>=0;
    var partyHead=custSide?'Customer':'Vendor';
    var subTotal=items.reduce(function(s,c){return s+(c.amount||0);},0);
    var lines=items.map(function(c){
      var doc=c.documents?'<span class="cl-doc">'+esc(c.documents)+'</span>':'<span class="cl-dash">–</span>';
      // party: customer-side -> project customer; vendor-side -> the row's vendor
      var partyVal=custSide?esc(p.customer||'—'):(c.vendor?esc(c.vendor):'<span class="cl-dash">–</span>');
      // Description: for Bond rows show the issuing bank, matched on the document number
      // when it lines up with a bond record, otherwise the project's distinct bank names.
      var detail;
      if(isBG(subj)){
        var bonds=(p.bonds||[]);
        var hit=c.documents?bonds.filter(function(bd){
          return String(bd.bondNo||'').trim() && String(bd.bondNo).trim()===String(c.documents).trim();
        })[0]:null;
        var bankTxt='';
        if(hit && hit.bank) bankTxt=hit.bank;
        else {
          var seen={},names=[];
          bonds.forEach(function(bd){ var bk=String(bd.bank||'').trim(); if(bk&&!seen[bk]){seen[bk]=1;names.push(bk);} });
          bankTxt=names.join(', ');
        }
        detail=bankTxt?esc(bankTxt):(c.details?esc(c.details):(c.note?esc(c.note):'<span class="cl-dash">–</span>'));
      } else if(subj==='Customer Retention'){
        detail='<span class="cl-dash">–</span>';
      } else {
        detail=c.details?esc(c.details):(c.note?esc(c.note):'<span class="cl-dash">–</span>');
      }
      var amt=c.amount?'<span class="cl-amt num">'+fmtB2(c.amount)+'</span>':'<span class="cl-dash">–</span>';
      var asOf=c.asOf?'<span class="num">'+enDate(c.asOf)+'</span>':'<span class="cl-dash">–</span>';
      return '<tr><td class="clh-doc">'+doc+'</td><td class="clh-vendor">'+partyVal+'</td><td class="clh-detail">'+detail+'</td><td class="clh-amt">'+amt+'</td><td class="clh-asof">'+asOf+'</td></tr>';
    }).join('');
    var totalTag=subTotal?'<span class="cl-grp-total num">'+fmtB2(subTotal)+' Baht</span>':'';
    return '<div class="cl-group">'+
      '<div class="cl-grp-h"><span class="cl-grp-name">'+esc(closureSubjectLabel(subj))+'</span>'+totalTag+'</div>'+
      '<div class="clh-wrap"><table class="clh-table"><thead><tr>'+
        '<th class="clh-doc-th">Documents</th><th class="clh-vendor-th">'+partyHead+'</th><th class="clh-detail-th">Description</th><th class="clh-amt-th">Outstanding (Baht)</th><th class="clh-asof-th">As of</th>'+
      '</tr></thead><tbody>'+lines+'</tbody></table></div>'+
    '</div>';
  }).join('');
  return '<div class="closure-block"><div class="clh-block-head"><span class="clh-block-title"><span class="clh-block-ic">'+ICON.alert+'</span>Outstanding Closure Issues</span></div>'+body+'</div>';
}
function openModal(item){
  var p=DATA.projects.filter(function(x){return x.item===item;})[0]; if(!p) return;
  var st=statusLabel(p); var isOld=(p.statusContract!=='Active');
  var hasClosure=closureOpenItems(p).length>0;
  var mo=document.getElementById('modal');
  var inChargeChip=leaderTxt(p.leader)?'<span class="mh-incharge"><span class="mh-ic-ic">'+ICON.user+'</span><span class="mh-ic-txt"><span class="mh-ic-l">In Charge</span><span class="mh-ic-v">'+esc(leaderTxt(p.leader))+'</span></span></span>':'';
  var html='<div class="mh"><div class="mic">'+ICON.file+'</div><div class="mt"><div class="badges"><span class="code">'+esc(p.ref||('#'+p.item))+'</span><span class="pill '+typeKey(p.type)+'"><span class="pd"></span>'+esc(typeLabel(p.type))+'</span><span class="pill '+st.cls+'"><span class="pd"></span>'+st.txt+'</span></div><div class="ttl">'+esc(p.name)+'</div></div>'+inChargeChip+'<button class="mx" onclick="closeModal()">✕</button></div>';
  if(hasClosure){
    // Focused, issue-oriented view: only the project context needed to act, then the issues.
    html+='<div class="mb mb-closure">';
    html+='<div class="cl-ctx">'+
      '<div class="cl-ctx-item cl-ctx-left"><span class="cl-ctx-l">Customer</span><span class="cl-ctx-v">'+esc(p.customer)+'</span></div>'+
      '<div class="cl-ctx-item cl-ctx-center"><span class="cl-ctx-l">Contract Start</span><span class="cl-ctx-v num">'+enDate(p.start)+'</span></div>'+
      '<div class="cl-ctx-item cl-ctx-right"><span class="cl-ctx-l">Contract End</span><span class="cl-ctx-v num">'+enDate(p.end)+'</span></div>'+
    '</div>';
    html+=closureBlockHtml(p);
    html+='</div>';
    mo.innerHTML=html;
    mo.classList.add('wide'); mo.classList.add('wide-closure');
    document.getElementById('ov').classList.add('show');
    return;
  }
  html+='<div class="mb mb3">';
  html+='<div class="fld"><div class="fl">Customer</div><div class="fv">'+esc(p.customer)+'</div></div>';
  html+='<div class="fld"><div class="fl">Contract No. / PO.</div><div class="fv num" style="line-height:1.5">'+(p.contractNo?contractNoHtml(p.contractNo):'—')+'</div></div>';
  html+='<div class="fld valcell"><div class="fl">Project Value (Ex Vat)</div><div class="fv num">'+fmtB(p.value)+' <span class="u">Baht</span></div></div>';
  html+='<div class="fld"><div class="fl">Start Date</div><div class="fv num">'+enDate(p.start)+'</div></div>';
  html+='<div class="fld"><div class="fl">End Date</div><div class="fv num">'+enDate(p.end)+'</div></div>';
  html+='<div class="fld"><div class="fl">Contract Period</div><div class="fv">'+esc(p.period||'—')+'</div></div>';
  html+='<div class="bond-slot">'+bondBlockHtml(p)+'</div>';
  html+='</div>';
  mo.innerHTML=html;
  mo.classList.add('wide-modal');
  mo.classList.remove('wide');
  document.getElementById('ov').classList.add('show');
}
function closeModal(){ document.getElementById('ov').classList.remove('show'); var m=document.getElementById('modal'); m.classList.remove('wide'); m.classList.remove('wide-closure'); m.classList.remove('wide-modal'); m.classList.remove('wide-bond'); }
</script>
